    - "2026-09-01: agregada sección 'Pantalla' al panel 'Casos de uso' (Modal subido de size sm a md) con switch 'Responsive' (core/session/forcedViewport.ts, mismo patrón que activeUseCase.ts). Al activarlo aplica una clase global 'force-mobile' (AppShell.tsx) que fuerza el mismo estado que el breakpoint real de 768px en Header/Sidebar/AppShell, sin depender del ancho real de la ventana: riel del Sidebar oculto, header vacío salvo hamburguesa (logo/Nuevo envío/usuario se ocultan — antes sólo se ocultaba el texto de usuario, ahora TODO el bloque, corrigiendo también el breakpoint real para que no diverja del forzado), cajón con el árbol completo (Panel, Mis envíos, Servicios, Mi saldo, Integraciones, Mi cuenta, Nuevo envío) igual a la imagen de referencia del usuario. Verificado en navegador con la ventana en tamaño desktop real. Documentado en pantalla-reclamos-listado.md sección 5."
    - "2026-09-01 (ajuste sobre el ítem anterior, mismo día): el usuario pidió que el switch 'Responsive' angoste efectivamente el ancho visible, no sólo reacomode el layout. Se logró con `transform: translateZ(0)` en el wrapper `force-mobile` (AppShell.module.css) + `max-width: 390px` + `margin: 0 auto` — un `transform` distinto de `none` convierte al elemento en el containing block de sus descendientes `position: fixed` (Header, riel del Sidebar, ChatBubble, HubAccessButton), que dejan de posicionarse contra la ventana real y pasan a posicionarse contra esos 390px. El Modal 'Casos de uso' queda afuera del efecto a propósito (se renderiza en portal a <body>, fuera del wrapper) — el panel de control sigue a tamaño normal mientras el contenido controlado se ve angosto. Verificado en navegador: pantalla completa se angosta y centra con sombra, el cajón mobile y los botones flotantes quedan contenidos dentro del marco angosto. Build de producción limpio."
    - "2026-09-01: se agregaron hub/motivos-reclamo-por-perfil.html y hub/pantalla-reclamos-listado.html (transcripción HTML fiel de los .md, mismo patrón visual del Hub) — documentacion.html pasó de 2 a 4 cards, todas con botón de Descargar (.md real, copiado a hub/downloads/). READMEs (raíz y proto navegable) corregidos: ya no dicen 'sin funcionalidad de negocio', reflejan que existe la pantalla de Reclamos real."
    - "2026-09-01: todo el trabajo acumulado de la sesión (Reclamos, Casos de uso, modo responsive, documentación del Hub) commiteado y pusheado a https://github.com/Marcolof/consultas-correo (commit c737546). Verificado en GitHub (6 commits en main) y en producción: https://consultas-correo-v1.vercel.app/documentacion.html ya muestra las 4 cards — el deploy automático de Vercel por push a main funcionó sin intervención manual."
    - "2026-09-02: 4 ajustes de UI en ReclamosListPage a pedido del usuario: contador dice 'reclamos' (antes 'consultas'), filas del listado sin sombra (sólo fondo + borde), se quitó el título 'Tipos de Reclamos' sobre los chips, y el SearchBar pasó de totalmente redondeado a radio 12px (nuevo token --radius-md-lg) por fidelidad con la propuesta de Figma. Commiteado y pusheado (commit ade88e6)."
    - "2026-09-02: corregido alineado de PageContainer — en pantallas anchas ya no centra su contenido (se sacó margin:0 auto de .narrow), y el padding horizontal en desktop se ajustó a 3rem (--space-12) por fidelidad con la web real de MiCorreo (verificado con captura de producción del usuario, clase .px-5 de Bootstrap = 3rem). Se agregó también el override :global(.force-mobile) que faltaba, para que el modo responsive forzado del prototipo (que no cambia el ancho real de la ventana) use el padding mobile real (16px) en vez de heredar el de desktop."
    - "2026-09-02: usuario notó que la card 'Prototipo navegable' del Hub deployado apuntaba a localhost. Se creó el segundo proyecto Vercel del repo usando el atajo de import que Vercel ya sugería (Root Directory='proto navegable', Vite autodetectado) — nombre normalizado a 'proto-navegable' por validación de Vercel (minúsculas, sin espacio). Deployado y verificado en vivo: https://proto-navegable.vercel.app muestra la pantalla real de Reclamos con todos los ajustes de la sesión. Actualizados hub/index.html (href de la card) y HubAccessButton.tsx (HUB_URL ahora apunta a https://consultas-correo-v1.vercel.app/ en vez de localhost). Nota: existe un tercer proyecto 'consultas-correo' (sin sufijo) auto-creado por Vercel apuntando a la raíz del repo (404) — se dejó sin usar, no se tocó ni se borró."
    - "2026-09-02: creado documentation/analisis-funcional-reclamos.md — documento nuevo, consolida (no reemplaza) brief + motivos-reclamo-por-perfil + pantalla-reclamos-listado en formato de lectura rápida para un Analista Funcional (AFU): objetivo, alcance, perfiles, reglas de negocio (A y B), flujo funcional paso a paso, preguntas pendientes de definición y tabla de trazabilidad de fuentes. Agregado al Hub como 5ta card de documentacion.html (hub/analisis-funcional-reclamos.html + hub/downloads/analisis-funcional-reclamos.md). De paso se actualizaron pantalla-reclamos-listado.md y su .html en el Hub para reflejar los 4 ajustes de UI del ítem anterior (quedaban desactualizados)."
    - "2026-09-02: analizado 'docs externos/31_08_2026_ACT Relevamiento Inicial de Gestion de Reclamos.docx.pdf' — acta real de la Reunión funcional N°1 (31/08/2026) entre MC (Anabella Prado, Wanda Regina De Virgilio) y Proyecto ED (Agustina Gualco, Marco Laforte, Marcela Demichelis), elaborada por Marcela Demichelis. Confirma varias cosas de negocio que NO teníamos documentadas: (1) el MVP es explícitamente 'rediseñar la pantalla inicial de Reclamos' manteniendo intactos los motivos y los FORMULARIOS particulares de cada reclamo existentes — el rediseño de esos formularios queda para una etapa posterior, fuera de este MVP; (2) hay una fecha objetivo de producción: 07/10/2026, con el compromiso de cerrar el alcance inicial 'durante esta semana' (a partir del 31/08/2026); (3) hay un compromiso explícito, mismo día del acta: 'Marcos + Marcela mostrar una propuesta visual inicial de la pantalla inicial de la sección Reclamos' — coincide con el trabajo ya hecho en el prototipo y en Figma; (4) IA (que el usuario escriba libre y el sistema detecte el motivo) es visión a futuro EXPLÍCITAMENTE fuera del MVP; (5) se está evaluando además un renombre de la sección 'Reclamos' (alternativa mencionada: 'Contacto'), sin decidir; (6) se presentó un trabajo preliminar de AGRUPACIÓN de motivos por categorías de producto/servicio — 'Franquicias, Paquetería, Fulfillment, Mi cuenta' — que es un eje DISTINTO del que ya tenemos implementado (perfil de usuario: Individuo/Franquicias/Fulfillment); no está claro si reemplaza, complementa o convive con la regla de perfiles ya construida — ver open_questions. (7) MC debe entregar documentación 'CG01' y Proyecto ED documentación 'CG05', ambas con fecha límite viernes 4/9/2026 — todavía no llegaron, no están en este repo."
    - "2026-09-02: confirmado que 'docs externos/motivos_reclamo_config.json' es un archivo EXTERNO real (no inventado en el chat) con el mismo contenido exacto que documentation/data/motivos-reclamo-por-perfil.json (mismos 3 perfiles, mismos 19 motivos, mismo mapeo) — corrobora la autoridad del dato ya documentado, no aporta información nueva."
    - "2026-09-02 (definición grande del usuario, misma sesión que el análisis del acta): (1) la sección cambia de nombre de 'Reclamos' a 'Mis gestiones' — el usuario avisó explícitamente que es probable que este nombre se vuelva a cambiar, así que se implementó como una única constante editable (proto navegable/src/core/gestiones/sectionLabel.ts: SECTION_LABEL/ITEM_LABEL_SINGULAR/ITEM_LABEL_PLURAL) en vez de hardcodear el texto en cada lugar. (2) El eje de filtro de la pantalla pasa de perfil de usuario a 7 CATEGORÍAS de producto/servicio (chips): Mi Cuenta, Paquetería Nacional, Paquetería Internacional, Franquicias, Fulfillment, Mis Comunicaciones Digitales, Oficios Judiciales — esto RESUELVE la pregunta abierta que había quedado del acta del 31/08 sobre si la categorización convivía con el eje de perfil; la respuesta es que la categorización LO REEMPLAZA para esta pantalla. (3) Sólo Franquicias (6 gestiones dadas por el usuario) y Fulfillment (4 gestiones dadas por el usuario) tienen contenido textualmente confirmado por el negocio — dato de negocio real, documentado en documentation/mis-gestiones-categorias.md. (4) Las otras 5 categorías se completaron por decisión de Claude, con dos niveles de certeza que se documentaron por separado y NO deben confundirse: Mi Cuenta/Paquetería Nacional/Oficios Judiciales = gestiones REALES (de la matriz de 19 motivos ya conocida) reagrupadas por intuición semántica, sin validar con el negocio; Paquetería Internacional/Mis Comunicaciones Digitales = 4 gestiones cada una INVENTADAS sin ningún dato real detrás, cada label termina literalmente en '(Gestión inventada)' por pedido explícito del usuario. (5) El mecanismo de perfil de usuario (Individuo/Franquicias/Fulfillment, sección 'Usuarios' del panel 'Casos de uso') quedó SUPERSEDED para esta pantalla — se sacó del panel porque ya no tenía ningún efecto (las 7 categorías se muestran siempre completas, sin depender de perfil). El código y los datos (core/session/activeUseCase.ts, core/reclamos/reasonProfiles.ts, core/reclamos/profileVisibility.ts + sus JSON) NO se borraron, quedan documentados como histórico por si se retoman. (6) No se renombró el ítem 'Ingresar Reclamos' del menú de usuario replicado del sitio real (core/navigation/navigation.config.ts) — es fidelidad de chrome de producción, no la pantalla rediseñada. Tampoco se renombraron archivos/carpetas internos (ReclamosListPage.tsx, core/reclamos/) — decisión explícita para minimizar riesgo, documentada en mis-gestiones-categorias.md sección 1. Verificado: typecheck limpio, build de producción limpio, probado en navegador (27 gestiones en 'Todos' = 2+6+4+4+6+4+1, chip 'Paquetería Internacional' muestra las 4 gestiones inventadas con el sufijo correcto, panel 'Casos de uso' ya sin la sección 'Usuarios')."
    - "2026-09-02 (mismo día, corrección sobre el ítem anterior): el usuario aclaró que el mecanismo de perfil de usuario NO quedó reemplazado — sigue existiendo e impacta las agrupaciones (categorías), sólo que ahora son 4 tipos (se agregó 'Pyme') y el eje que controla es la VISIBILIDAD DE CATEGORÍAS (chips), no la de motivos individuales (eso sigue superseded). Regla textual del usuario, sin inferencia: franquicia no ve el grupo/chip 'Fulfillment'; fulfillment no ve 'Franquicia'; individuo y pyme no ven 'Franquicia' ni 'Fulfillment'. Las otras 5 categorías (Mi Cuenta, Paquetería Nacional, Paquetería Internacional, Mis Comunicaciones Digitales, Oficios Judiciales) se ven por igual en los 4 tipos (supuesto, no exclusión textual). Implementado: (1) documentation/data/categorias-gestiones.json subió a schema_version 2, con 'user_types' (4 tipos) y 'profile_category_visibility' (perfil→ids de categoría visibles) como pidió el usuario — una 'base de datos' de 2 niveles (perfil→categorías, categoría→gestiones) pensada para que un dev la edite directamente. (2) core/gestiones/categories.ts expone USER_PROFILES, DEFAULT_USER_PROFILE y visibleCategoriesForProfile(). (3) core/session/activeUseCase.ts repuntado a core/gestiones/categories (antes apuntaba a core/reclamos/reasonProfiles) — mismo patrón de context, ahora con 4 perfiles. (4) HubAccessButton.tsx: se restauró la sección 'Usuarios' del panel 'Casos de uso' (se había sacado horas antes en la misma sesión), ahora con ChipGroup de 4 opciones. (5) ReclamosListPage.tsx: los chips vuelven a depender del perfil activo (useActiveUseCase), con el mismo reseteo automático a 'Todos' de antes si la categoría elegida deja de estar visible al cambiar de perfil. Verificado en navegador: Individuo ve 5 categorías (sin Franquicias/Fulfillment), Franquicias ve 6 (sin Fulfillment), y al cambiar de Franquicias a Fulfillment con el chip 'Franquicias' seleccionado, el filtro resetea solo a 'Todos'. Typecheck y build limpios. Documentado en mis-gestiones-categorias.md secciones 6-9 (renumeradas), pantalla-reclamos-listado.md sección 4 y analisis-funcional-reclamos.md secciones 3-6, con sus equivalentes en el Hub."
    - "2026-09-02 (mismo día, tercer pedido sobre este dataset): el usuario pidió agregar TAGS de búsqueda a cada gestión, generados por Claude (no dato de negocio), máx. 10 por gestión, dio como ejemplo 'Oficios Judiciales → justicia, citación, oficial, cobro, error, falla'. Pidió además un caso especial: si un usuario escribe 'fulfillment' en el buscador debe ver todas las gestiones de esa categoría sin tocar el chip — logrado agregando el tag literal 'fulfillment' a todas las gestiones de esa categoría (y 'franquicia'/'franquicias' a las de Franquicias), sin lógica de código aparte, sólo un tag más matcheado por el buscador. Por pedido explícito, este tag especial de categoría sólo se dio a Fulfillment y Franquicias por ahora. Implementado: (1) documentation/data/categorias-gestiones.json subió a schema_version 3, cada item ahora tiene 'tags' (array de strings, ≤10). (2) core/gestiones/categories.ts: GestionItem ganó el campo tags. (3) ReclamosListPage.tsx: la búsqueda ahora matchea contra label + tags (antes sólo label), mismo normalize() sin acentos de siempre. Verificado en navegador: buscar 'justicia' con 'Todos' seleccionado encuentra 'Inconvenientes con el pago de oficios judiciales' (match por tag, no por label); buscar 'fulfillment' con 'Todos' seleccionado y perfil Individuo activo (que ni siquiera ve el chip Fulfillment) muestra las 6 gestiones de esa categoría. Typecheck y build limpios. Sólo trabajado en local, sin commit ni push (pedido explícito del usuario: 'por ahora solo trabajar el local'). Documentado en mis-gestiones-categorias.md sección 9 (nueva) y su equivalente en el Hub."
    - "2026-09-02 (mismo día, bug encontrado por el usuario probando el prototipo): 'Todos' mostraba las 27 gestiones del sistema completo sin importar el perfil de usuario activo — INCORRECTO. La regla real: un individuo/pyme no debe ver NINGUNA gestión de Franquicias ni Fulfillment, ni siquiera con 'Todos' seleccionado; Franquicias no ve las de Fulfillment (pero sí ve todo lo demás que ve individuo/pyme); Fulfillment no ve las de Franquicias (ídem). Causa: core/gestiones/categories.ts → itemsForFilter() hacía flatMap sobre GESTION_CATEGORIES (las 7 categorías del sistema) en vez de sobre las categorías visibles para el perfil activo. Fix: itemsForFilter() ahora recibe visibleCategories como parámetro obligatorio (ya calculado en ReclamosListPage.tsx vía visibleCategoriesForProfile) y opera sólo sobre esa lista, tanto para 'Todos' como para una categoría puntual. Como consecuencia, la búsqueda por texto/tags también quedó aislada por perfil automáticamente (no hizo falta tocar la búsqueda: opera sobre el resultado ya filtrado). Verificado en navegador: Individuo con 'Todos' ve 17 gestiones (antes 27); Franquicias ve 21; buscar 'franquicia' siendo Individuo da 0 resultados (antes hubiera encontrado las 4 de Franquicias). Typecheck y build limpios. El usuario preguntó además dónde vive el archivo que filtra esto — respondido y documentado explícitamente (sección 0 nueva) en mis-gestiones-categorias.md: hay 2 copias (documentation/data/categorias-gestiones.json y proto navegable/src/core/gestiones/data/categorias-gestiones.json), leídas por core/gestiones/categories.ts. Commiteado y pusheado a GitHub (commit 898c886) junto con el resto de los cambios de la sesión (rename a 'Mis gestiones', categorías, tags, tipos de usuario) — verificado en producción (proto-navegable.vercel.app)."
    - "2026-09-02 (mismo día, pregunta del usuario sobre la duplicación): el usuario notó que los archivos de datos (categorias-gestiones.json, motivos-reclamo-por-perfil.json, visibilidad-perfiles.json) existían 2 veces — una copia en documentation/data/ y otra en proto navegable/src/core/*/data/ — y pidió centralizar la documentación. Se verificó que las 3 parejas de copias eran idénticas byte a byte (sin drift todavía, `diff` sin salida) y se ELIMINARON las 3 copias de documentation/data/ (carpeta ahora vacía), dejando como única fuente la copia dentro de proto navegable/ (la que valida el build/typecheck de la app, a diferencia de una copia sólo-documentación que puede desactualizarse sin que nada avise). Se actualizaron todos los links en motivos-reclamo-por-perfil.md, mis-gestiones-categorias.md (nueva sección 11 'Nota de consolidación'), pantalla-reclamos-listado.md, project.yaml (sources + artifacts.data_path) y el Hub (mis-gestiones-categorias.html), apuntando a la ruta única dentro de proto navegable/. NO se tocaron hub/downloads/*.json: esas copias existen por un motivo distinto y legítimo (el Hub deployado en Vercel con Root Directory='hub' no incluye ni documentation/ ni proto navegable/, necesita su propia copia para servir la descarga) — documentado explícitamente como excepción, no como descuido. Typecheck y build de la app verificados sin cambios (no se tocó ningún archivo que el código importe)."
    - "2026-09-02 (mismo día, ampliación de tags pedida por el usuario): con ejemplos explícitos ('si dice error, agregar falla'; 'si dice demora, agregar problema'), se agregaron tags de sinónimo por patrón de texto en el label, aplicados a las 27 gestiones (no sólo a los 2 ejemplos dados): label con 'error'/'erróneo'/'incorrecto' → tag 'falla'; label con 'demora' → tag 'problema'; extendido por coherencia a 'problema(s)'/'inconveniente(s)' → tag 'problema' donde faltaba. categorias-gestiones.json subió a schema_version 4. Ningún ítem superó el máximo de 10 tags (quedaron entre 5 y 9, verificado con grep). Verificado en navegador: con perfil Individuo activo, buscar 'falla' da 5 gestiones y 'problema' da 6 — ambos coinciden exactamente con la cuenta manual de qué ítems (dentro de las categorías visibles para ese perfil) llevan cada tag. Typecheck y build limpios. Documentado en mis-gestiones-categorias.md sección 9.2 (nueva) y su equivalente en el Hub. Sincronizada la única copia adicional que sigue existiendo por motivo de deploy (hub/downloads/categorias-gestiones.json). Sin commit ni push todavía."
    - "2026-09-02 (mismo día, 2da ampliación de tags): el usuario pidió generalizar a TODAS las categorías el patrón que hasta ahora sólo tenían Fulfillment/Franquicias — que buscar el nombre de una categoría (ej. 'Mi Cuenta') muestre todas sus gestiones. Se agregó a cada gestión el tag de su propia categoría: mi_cuenta→'mi cuenta', paqueteria_nacional→'paqueteria nacional', paqueteria_internacional→'paqueteria internacional', mis_comunicaciones_digitales→'comunicaciones digitales', oficios_judiciales→'oficios judiciales' (franquicias/fulfillment ya lo tenían desde antes). categorias-gestiones.json subió a schema_version 5. Máximo de tags por ítem alcanzado: 10 (justo en el límite, ninguno lo supera). Verificado en navegador: buscar 'Mi Cuenta' (con mayúsculas) da exactamente las 2 gestiones de esa categoría; buscar 'Paquetería Nacional' (con tilde y mayúsculas) da las 6 exactas — confirma que normalize() maneja bien acentos/mayúsculas también para estos tags multi-palabra. Typecheck y build limpios. Documentado en mis-gestiones-categorias.md sección 9.1 (reescrita) y su equivalente en el Hub, sincronizado hub/downloads/categorias-gestiones.json. Sin commit ni push todavía."
    - "2026-09-03: se armó una presentación V1 navegable del proyecto (skill presentacion-proyecto), agregada al Hub como 3ra card ('Presentaciones' → hub/presentaciones.html → hub/presentaciones/presentacion-v1.html), con capturas embebidas del prototipo real vía iframes con deep-link (?profile=/?category=/?q=/?responsive=1/?useCases=1, agregado a core/session/deepLink.ts + providers.tsx/ReclamosListPage.tsx/HubAccessButton.tsx). A pedido del usuario ('el cliente no debe enterarse de que existe un prototipo navegable'), se ocultaron después todas las menciones a 'prototipo navegable'/Hub/rutas de documentación interna, se sacaron los 17 pills 'Volver al hub', y se borró la slide de 'simular tipo de usuario activo' (tooling de prototipo) — el deck ahora narra como si fueran capturas estáticas de Figma. Además se generó un PPTX editable (proto navegable/../hub/presentaciones/presentacion-v1.pptx, via pptxgenjs + Node) con capturas reales tomadas con Puppeteer headless contra proto-navegable.vercel.app (guardadas en hub/presentaciones/screenshots/, con el botón flotante de tooling del prototipo ocultado por CSS antes de cada captura) — 2 rondas de fix pedidas por el usuario: el frame de captura se recalculó para no pasarse del margen derecho del slide, y los chips 'eyebrow' se agrandaron (fórmula de ancho por longitud de texto) para que el texto en mayúsculas/negrita no saltara de línea."
    - "2026-09-03 (bug de búsqueda reportado por el usuario, fix intermedio): buscar 'error justicia' (dos tags de la misma gestión, 'Inconvenientes con el pago de oficios judiciales') daba 'No encontramos gestiones' porque el buscador matcheaba la frase completa como un solo string contra label/tags. Fix: ReclamosListPage.tsx ahora separa la búsqueda en palabras y exige que TODAS matcheen (en cualquier combinación de label+tags de la misma gestión) — no que estén juntas en un mismo campo. Verificado: 'error justicia' → esa gestión aparece porque tiene ambos tags por separado."
    - "2026-09-03 (mismo día, 2 pedidos más sobre datos y buscador): (1) el usuario pidió subir el límite de tags de 10 a 50 y sumar muchos sinónimos coloquiales por gestión (ejemplos dados: 'paquete'→caja/envío/bulto, 'faltante'→robo/vacío/incompleto) — aplicado a las 27 gestiones, cada una subió de 5-10 a 13-25 tags; categorias-gestiones.json subió a schema_version 6. (2) el usuario reportó que el fix anterior (AND de todas las palabras) rompía frases naturales: 'no me acepta pago' daba 0 resultados porque 'no'/'me'/'acepta' no son tags de nada, aunque 'pago' sí matcheaba. Fix definitivo en ReclamosListPage.tsx: se ignoran palabras de 1-2 letras al exigir el match, alcanza con que UNA sola palabra significativa matchee (ya no todas), y los resultados se ordenan por cantidad de palabras coincidentes (más relevante primero) — 'error justicia' sigue funcionando y ahora ordena esa gestión primero en vez de mezclarla con las que sólo matchean 'error'. Verificado en navegador con ambos casos. Documentado en mis-gestiones-categorias.md secciones 9.3/9.4 (+ Hub), corregidas también las menciones desactualizadas en pantalla-reclamos-listado.md y analisis-funcional-reclamos.md que decían 'el buscador filtra sólo por label, no por tags/sinónimos' (quedaron obsoletas desde el 2026-09-02, no se habían corregido hasta ahora). Sincronizados hub/downloads/{categorias-gestiones.json, mis-gestiones-categorias.md, pantalla-reclamos-listado.md, analisis-funcional-reclamos.md} y sus 3 .html del Hub. Se creó .claude/launch.json (servidor dev de proto navegable, puerto 4300) para poder verificar los cambios de búsqueda en el Browser pane antes de documentarlos."
    - "2026-09-03 (unificación de URLs, opción 3 de las 4 analizadas con el usuario): el usuario pidió pasar a monorepo real con UNA sola URL madre y todo lo demás como rutas hijas, para no seguir generando URLs sueltas por cada artefacto. Antes: 2 proyectos Vercel independientes (consultas-correo-v1 con Root Directory='hub' + proto-navegable con Root Directory='proto navegable'), cada uno con su dominio .vercel.app, enlazados a mano — ya había fallado una vez (el Hub apuntó a localhost hasta que se detectó). Ahora: un solo sitio. Implementado: (1) package.json en la RAÍZ del repo (antes no existía) con script 'build' que compila el prototipo y corre scripts/build-hub.mjs, que copia proto navegable/dist a hub/prototipo/; 'postinstall' instala las deps del subproyecto para que un solo `npm install` alcance en local y en CI. (2) vite.config.ts: base='/prototipo/' (sin esto los assets se pedirían a /assets/... y romperían al no estar en la raíz del dominio). (3) App.tsx: BrowserRouter basename={import.meta.env.BASE_URL} — lee el mismo base de Vite, así hay una única fuente de verdad para la ruta del prototipo. (4) vercel.json en la raíz (config-as-code, antes todo vivía sólo en el dashboard): buildCommand/outputDirectory='hub'/installCommand + un rewrite /prototipo/(.*) -> /prototipo/index.html para el routing SPA (hoy hay una sola ruta, pero el router está pensado para sumar pantallas). (5) hub/prototipo/ agregado a .gitignore: es salida de build, se regenera en cada deploy. (6) Links internos que apuntaban a la otra URL: card del Hub -> 'prototipo/' relativo; HubAccessButton HUB_URL de 'https://consultas-correo-v1.vercel.app/' a '/' (funciona igual en local, preview y prod); los 8 iframes del deck de https://proto-navegable.vercel.app/?... a ../prototipo/?... — efecto secundario buscado: el código fuente del deck ya no expone ninguna URL externa del prototipo, refuerza el pedido previo de que el cliente no sepa que existe un prototipo navegable. Verificado en local sirviendo sólo hub/: prototipo carga bajo /prototipo/ con deep-link (?profile=franquicias -> 21 gestiones, chip Franquicias visible), sin errores de consola, iframes del deck resolviendo por ruta relativa, y la card del Hub navegando al prototipo dentro del mismo sitio."
    - "2026-09-03: el usuario pidió ocultar por defecto Paquetería Internacional y Mis Comunicaciones Digitales (chip + sus gestiones inventadas) para todos los tipos de usuario, con un switch nuevo en 'Casos de uso' por cada una ('Ver Paquetería Internacional', 'Ver Comunicaciones Digitales') que las reincorpora a demanda. Implementado: HIDDEN_BY_DEFAULT_CATEGORY_IDS + applyUnavailableCategoryToggles en core/gestiones/categories.ts (capa ortogonal a profile_category_visibility — no es regla de perfil, es 'no existe todavía'); core/session/categoryToggles.ts (mismo patrón que forcedViewport.ts) + sección 'Categorías en construcción' en HubAccessButton.tsx; deep-link ?paqueteriaInternacional=1 / ?comunicacionesDigitales=1. Efecto en 'Todos': Individuo/Pyme 17->9, Franquicias 21->13, Fulfillment 23->15 (con ambos switches prendidos vuelve a los números viejos). Se actualizó también la presentación V1 (contadores de las slides Paso 1/Franquicias/Fulfillment, y el iframe de la slide 'Transparencia' que deep-linkeaba a category=paqueteria_internacional ahora suma &paqueteriaInternacional=1 porque si no el filtro se resetea solo a 'Todos' al no estar ese chip disponible) y mis-gestiones-categorias.md (nueva sección 5.1, tabla de la sección 2 con columna 'Disponible hoy', números de la sección 6 corregidos) + su espejo en el Hub y hub/downloads/. Verificado en navegador: Individuo con 'Todos' y switches apagados da 9 gestiones; activar 'Ver Paquetería Internacional' sube a 13 y reaparece el chip."
    - "2026-09-03 (encuadre de alcance sobre el cambio anterior): el usuario pidió que se aclare explícitamente que Paquetería Internacional y Mis Comunicaciones Digitales están 'fuera del MVP' para una 'próxima salida' — no sólo 'ocultas hasta que exista contenido real' (framing técnico previo, ahora reforzado con la lectura de negocio). Actualizado: mis-gestiones-categorias.md sección 5.1 (título y aviso), analisis-funcional-reclamos.md (tabla 4.1 con columna 'Disponible hoy', recuadro de alcance nuevo, números de 'Todos' corregidos a 9/13/15 que habían quedado en 17/21/23 desde una ronda de edición anterior que no tocó este documento, pregunta 2 de la sección 6, fila nueva en la tabla de trazabilidad de la sección 7) y la presentación V1 (slides Transparencia/Franquicias/Fulfillment/Pendiente de definición, mismo lenguaje 'fuera del MVP para una próxima salida'). Sincronizados hub/downloads/{mis-gestiones-categorias.md, analisis-funcional-reclamos.md} y sus espejos .html. Explícitamente NO se regeneró el PPTX ni las capturas (pedido del usuario: 'no exportar la presentación aun') — el PPTX en hub/presentaciones/presentacion-v1.pptx sigue con el texto de la versión anterior (ocultas por defecto, sin el framing de MVP/próxima salida) y queda desalineado del deck HTML hasta la próxima exportación."
    - "2026-09-03 (mismo día, pedido de historias de usuario + análisis más detallado): el usuario pidió agregar historias de usuario y profundizar el análisis funcional. Agregadas a analisis-funcional-reclamos.md: sección 6 'Historias de usuario' (9 historias HU-01 a HU-09 en formato Como/Quiero/Para, con criterios de aceptación derivados de comportamiento ya verificado en navegador — no de negocio inventado; HU-08 marcada diferida/no implementada, HU-09 marcada fuera de este MVP) y sección 7 'Análisis funcional detallado' (7.1 tabla de 8 reglas de negocio RN-01 a RN-08 con su fuente/confianza, incluyendo cuáles son confirmadas vs. supuestas; 7.2 casos borde verificados —persistencia de búsqueda al cambiar de perfil, piso mínimo de 9 gestiones, búsqueda por nombre de categoría, ausencia de persistencia entre reloads—; 7.3 consideraciones no funcionales —sin backend real, sin debounce, accesibilidad no auditada, sin i18n—). Las secciones siguientes se renumeraron (Pendiente de definición 6→8, Trazabilidad 7→9, Documentos relacionados 8→10) y se agregó una fila de trazabilidad para las secciones nuevas. Sincronizado con hub/downloads/analisis-funcional-reclamos.md y su espejo hub/analisis-funcional-reclamos.html (versión condensada de las historias/reglas, con el detalle completo remitido al .md)."
    - "2026-09-03 (mismo día, gap detectado por el usuario): el ítem 'Ingresar Reclamos' del dropdown 'Mi cuenta' (chrome de navegación replicado del sitio real) había quedado como string literal hardcodeado en core/navigation/navigation.config.ts (SIDEBAR_DRAWER y HEADER_USER_MENU) — no seguía el rename de la sección a 'Mis gestiones' aplicado en sectionLabel.ts el 2026-09-02. El usuario lo marcó como 'una definición muy pobre' a corregir antes de que vuelvan a cambiar el nombre. Fix: ambos arrays ahora importan y usan SECTION_LABEL en vez del literal 'Ingresar Reclamos' — el ítem del menú sigue sin navegar a ningún lado (fidelidad de chrome intacta), sólo el texto sigue automáticamente al nombre vigente de la sección. Verificado en navegador: el dropdown 'Mi cuenta' ahora muestra 'Mis gestiones'. Typecheck limpio. Documentado en mis-gestiones-categorias.md sección 1 (reemplaza el párrafo anterior que decía explícitamente que este ítem NO se había tocado)."
    - "2026-09-03 (mismo día, pedido explícito sobre el fix anterior): el usuario pidió documentar en 'definiciones funcionales' qué pantallas quedaron afectadas por el rename, distinguiendo explícitamente que no todo es una pantalla — hay un componente global (chrome) de por medio. Agregada sección 2.1 'Pantallas y componentes afectados' a analisis-funcional-reclamos.md (tabla de 2 filas: la pantalla 'Mis gestiones' en pages/ReclamosListPage.tsx, y el ítem del dropdown 'Mi cuenta' del header en core/navigation/navigation.config.ts, marcado explícitamente como 'no es una pantalla', sin navegación propia). De paso se corrigió una referencia obsoleta en la sección 2 ('ruta / del prototipo' → 'ruta /prototipo/ dentro del sitio único', desactualizada desde la unificación de URLs). Sincronizado con hub/downloads/ y el espejo hub/analisis-funcional-reclamos.html. Verificado sirviendo hub/ localmente (puerto 4314)."
    - "2026-09-03 (mismo día, pedido sobre la presentación): el usuario pidió mostrar en la Presentación V1 el cambio del menú 'Mi cuenta' ('Ingresar Reclamos' → 'Mis gestiones'), aclarando explícitamente que NO había que exportar el PPTX, sólo agregar el slide dentro del deck en código. Como el dropdown no tenía forma de deep-linkearse (a diferencia de perfil/categoría/búsqueda/responsive), se agregó soporte nuevo: Header.tsx lee `?userMenuOpen=1` (mismo patrón que `useCases` en HubAccessButton.tsx) para arrancar con el dropdown ya desplegado — documentado en deepLink.ts. Se insertó un nuevo slide en presentacion-v1.html entre 'El recorrido' y el divider 'Pantallas', con iframe a `../prototipo/?profile=individuo&userMenuOpen=1`, explicando que es un componente global (no una pantalla) y que sólo cambió el texto, sin agregar navegación. La numeración de slides subió de 16 a 17. El PPTX (hub/presentaciones/presentacion-v1.pptx) NO se tocó — pedido explícito del usuario — así que queda un slide más desalineado respecto del deck HTML hasta la próxima exportación. Verificado en navegador local (build reconstruido con `npm run build`, servido en hub/): el dropdown aparece abierto con 'Mis gestiones' visible en la lista."
    - "2026-09-03 (mismo día, pedido sobre la presentación): el usuario pidió ocultar, únicamente dentro de los iframes de la presentación, el botón flotante inferior derecho 'Herramientas del prototipo' (el que abre 'Volver al Hub'/'Casos de uso') sin afectar el uso normal del prototipo. Agregado deep-link `?hideTooling=1` en HubAccessButton.tsx (return null si está presente, documentado en deepLink.ts) — mismo patrón que el resto de los toggles de query string. Se agregó `&hideTooling=1` a los 9 iframes de presentacion-v1.html. El ChatBubble (réplica real del chat del sitio) NO se oculta — sólo el botón de tooling, que nunca fue chrome de producción. Verificado en navegador: sin el param el botón sigue apareciendo normal (comportamiento por defecto intacto); con el param desaparece; el deck ya lo muestra oculto en todos los slides con iframe."
    - "2026-09-03 (mismo día, bug de render en el PPTX): el usuario reportó que los pills de la portada ('Categorías › Tipos de usuario › Búsqueda › Transparencia') salían con salto de línea, tanto el texto como el rectángulo redondeado detrás — la función addCrumb del script generador (scripts/pptx del scratchpad, no versionado en el repo) tenía la misma subestimación de ancho por longitud de texto que ya se había corregido en addEyebrow en una ronda anterior, pero nunca se había aplicado a los crumbs de portada. Fix: addCrumb sube a `0.5 + texto.length * 0.16` (antes `0.3 + texto.length * 0.1`) + wrap:false/shrinkText:false/autoFit:false explícitos; se auditó también addProfileTag (pills 'Individuo'/'Franquicias'/'Fulfillment') y se le aplicó el mismo margen de seguridad aunque no tenía el bug reportado. De paso se puso el PPTX al día con los 2 cambios de deck pendientes de exportar (el slide del menú 'Mi cuenta' y las capturas ya sin el botón de tooling): se agregó una 9na captura (00-mi-cuenta-menu.png, vía Puppeteer con ?userMenuOpen=1&hideTooling=1 contra producción) y su slide correspondiente en el mismo orden que el deck HTML. El PPTX y la captura nueva se commitearon al repo (hub/presentaciones/presentacion-v1.pptx + screenshots/00-mi-cuenta-menu.png); el script generador en sí sigue viviendo sólo en el entorno local de la sesión, no en el repo."
    - "2026-09-22 (cambio de rumbo del cliente): el usuario informó que hay INCONFORMIDAD del cliente con la propuesta presentada (V1) y pidió una alternativa manteniendo la anterior. Aportó el resumen de una reunión sobre arquitectura de Claims cuya idea central NO es rediseñar una pantalla sino mover el reclamo de lugar: que se inicie desde el contexto donde ocurre el problema (un envío, una operación) con formulario adaptativo y datos precargados, dejando la sección general como uno de los caminos y no el único. Se decidió con el usuario: (1) llamarlas V1 y V2 (no B1/B2); (2) V2 = recorrido conceptual multi-pantalla, no una variante de la misma pantalla; (3) alcance de V2 = UNA sola entidad (Envíos) recorrida hasta el final, en vez de varias entidades superficiales. Explícitamente FUERA de alcance de UX y no prototipado: el microservicio 'MS Claims', sus contratos/APIs, la IA sobre reclamos históricos y el informe de pentest mencionado en la misma reunión (ninguno tiene definición suficiente; se registran como contexto, no como requisito)."
    - "2026-09-22 (implementación de la estructura de versiones): la raíz del prototipo (/prototipo/) dejó de ser la pantalla de V1 y pasó a ser la LANDING del módulo — selector V1/V2, sin el chrome de MiCorreo a propósito (no es una pantalla del producto). V1 se movió a /prototipo/v1 SIN tocar un solo archivo suyo (mismo criterio de minimizar riesgo del 2026-09-02: no se renombró ReclamosListPage.tsx ni core/reclamos/); V2 vive entera en src/v2/ (core + data + pages + un único v2.module.css) y reutiliza el chrome (AppShell) y los primitivos de shared/ui sin duplicar tokens. Compatibilidad de enlaces viejos: la landing detecta los 9 query params de V1 (profile, category, q, responsive, useCases, paqueteriaInternacional, comunicacionesDigitales, userMenuOpen, hideTooling) y redirige a /v1 conservando la query — verificado que /prototipo/?profile=franquicias&hideTooling=1 aterriza en /prototipo/v1?profile=franquicias&hideTooling=1 con 13 gestiones y sin botón de tooling. Igual se repuntaron los 9 iframes de presentacion-v1.html a ../prototipo/v1?... (el deck es sobre V1, conviene que lo diga la URL). HubAccessButton ganó un tercer ítem, 'Cambiar de versión', que vuelve a la landing. Tarjeta del Hub actualizada a '2 versiones'. Typecheck y build de producción limpios; recorrido completo de V2 verificado en navegador (listado → detalle → motivos acotados por estado → formulario con validación de obligatorios → confirmación con nº de caso RC-2026-1001 → seguimiento en Mis gestiones), más deep link directo a /v2/envios/:id/reclamo?responsive=1 y ausencia de errores de consola."
    - "2026-09-22 (CORRECCIÓN grande del usuario sobre la interpretación anterior, mismo día): lo primero que se construyó como V2 (entrar desde un envío y elegir un motivo de una lista) NO era lo que el usuario pedía. Aclaró que 'propuesta ramificada' no significaba 'una rama alternativa a V1' sino que LA PROPUESTA MISMA ES UN ÁRBOL: un asistente que hace preguntas y va podando hasta el reclamo correcto, sin listado de reclamos preestablecidos a la vista. Ejemplo textual del usuario: primero preguntar '¿sos usuario de MiCorreo o no?', y si no lo es, llevarlo a otra consulta. Su duda explícita era CÓMO ARMAR esa estructura. Decisiones que cerró en la misma conversación: (1) máximo 3 preguntas hasta llegar a destino; (2) el buscador SE QUEDA — escribir da resultados directos y contestar preguntas es el otro camino, y ahí se dividen los dos flujos dentro de V2; (3) se tiene que poder volver atrás. Quedó SIN responder por el usuario si el árbol arranca igual para todos o distinto según quién esté logueado; se resolvió sin decidirlo, haciendo que una pregunta se saltee sola cuando el contexto ya tiene la respuesta (mismo árbol, sin ramas duplicadas)."
    - "2026-09-22 (V2 rehecha como asistente guiado): el árbol vive entero en proto navegable/src/v2/data/arbol.json como DICCIONARIO PLANO de nodos referenciados por id (no anidado, para que un nodo como 'no tengo cuenta' exista una sola vez aunque le lleguen varias ramas). 3 tipos de nodo: 'pregunta' (opciones con next), 'informacion' (resuelve SIN generar reclamo, con salida alternativa opcional 'quiero reclamar igual') y 'formulario' (hoja). Mecanismos clave: (a) CONTEXTO acumulado — cada opción puede 'guardar' datos, y una pregunta con 'guardaEn' cuya clave ya está en el contexto se saltea sola; (b) formularios.json subió a schema_version 2, unificando contexto y campos en UNA lista: un campo con 'contexto' se muestra precargado si el dato está y se le pide al usuario si no está, así un solo formulario sirve para los dos caminos (verificado: el formulario de demora pide 3 campos entrando desde un envío y 7 llegando sin cuenta); (c) 'visibleSi' oculta una opción según el contexto (un envío demorado no ofrece 'llegó dañado'); (d) el buscador (core/buscador.ts) indexa las HOJAS del mismo árbol vía indiceDeHojas() y devuelve el camino completo, así elegir un resultado deja el asistente en el mismo estado que si se hubiera recorrido pregunta por pregunta — los dos flujos convergen, no son estructuras paralelas; (e) todo el estado vive en la URL (?p=opciones,?q=búsqueda,?envio=id), así cualquier paso es enlazable, recargable, y volver atrás es recortar la lista. Se borraron ReclamoMotivoPage.tsx, ReclamoFormularioPage.tsx, core/motivos.ts, data/motivos-por-estado.json y pages/pasos.ts (absorbidos por el árbol). Las pantallas de envío se conservaron pero cambiaron de rol: ya no son el punto de partida sino una ENTRADA con respuestas precargadas (/v2/envios; 'Iniciar un reclamo' lleva a /v2?envio=ID y las 2 primeras preguntas se saltean solas). Verificado en navegador: recorrido anónimo de 3 preguntas, nodo de autoayuda con su salida alternativa, entrada desde envío saltando a la pregunta 3 con las opciones filtradas por estado, búsqueda 'no me acepta el pago' dando 6 resultados con su ruta, clic en un resultado aterrizando en el nodo correcto con el camino completo, volver atrás desde el breadcrumb, y alta de reclamo cerrando en seguimiento. Typecheck y build limpios, sin errores de consola en pestaña nueva."
    - "2026-09-22 (corrección del usuario, tercera de la misma jornada): el usuario detectó que se había agregado un flujo 'Mis gestiones' (listado + seguimiento de reclamos con estados) que NUNCA pidió. Pidió quitarlo ('no vamos a llevar un flujo donde se registren esas gestiones por ahora, más adelante quién sabe'). La documentación le da la razón y conviene dejarlo asentado: brief-consultas-reclamos.md sección 2 dice textualmente que en el HTML de producción 'no encontramos una vista de mis reclamos ya cargados (listado, seguimiento, estado): el archivo sólo cubre el alta', y la ausencia de esa pantalla figura en la sección 3 como HIPÓTESIS de fricción, no como requisito. Se eliminaron GestionesV2Page.tsx, su ruta, el listado reactivo del store (useSyncExternalStore + 2 reclamos sembrados + estados ingresado/en_analisis/resuelto) y el aviso de 'ya tenés un reclamo en curso' del detalle de envío. El store quedó reducido a crear un caso y poder leerlo en la confirmación; V2 termina en el número de caso."
    - "2026-09-22 (rediseño de la pantalla de V2 sobre imagen de referencia del usuario): el usuario aportó una captura de una página 'Contáctanos' de otro sitio (grilla de pocas opciones grandes con ícono + una fila de accesos rápidos abajo, bajo el título '¿Buscas más información?') y pidió seguir esa distribución manteniendo el árbol ya construido. Cambios: (1) título de pantalla a '¿Cómo podemos ayudarte?' SIN subtítulo (el anterior 'Buscá tu caso o respondé unas pocas preguntas...' se quitó por pedido explícito); (2) se quitó el contador 'Pregunta N de 3' —pedido textual: 'para que no nos condicione'— y con él la función profundidadMaxima(); la regla de 3 preguntas sigue escrita en arbol.json (_regla_de_profundidad) pero ya no se muestra; (3) se quitaron los textos de 'ayuda' de los nodos (pedido de austeridad: 'mantener poco texto y ser austeros'); (4) las opciones con ícono se muestran en grilla de tarjetas centradas (auto-fit, así 2 opciones ocupan mitades y no dejan hueco) y las de etiqueta larga siguen como filas; (5) íconos de línea inline nuevos (components/Icono.tsx + core/iconos.ts para tipar el dato sin que la capa de datos dependa de la de presentación), porque el chrome de MiCorreo no trae un set de línea; (6) DECISIÓN CONSCIENTE: el contenido de las tarjetas va centrado como la referencia pero la PÁGINA NO se centra — se mantiene la alineación izquierda del chrome real fijada el 2026-09-02 contra captura de producción. Se agregaron 5 'accesos_rapidos' a arbol.json, cada uno con el 'camino' que lleva a un nodo del mismo árbol (o 'ruta' a otra pantalla): Mis envíos, No tengo el número de seguimiento, No puedo ingresar a mi cuenta, Quiero crear una cuenta, Errores en mi factura — salidos de la matriz de gestiones de V1 y de las hojas de autoayuda existentes, no inventados de cero. Buscador: SearchInput ganó un prop OPCIONAL onClear (cruz a la derecha) para no alterar el buscador de V1 que no lo pasa; al escribir se muestra 'Buscando…' con un spinner mínimo durante 350ms deliberados (el filtro es en memoria y responde al instante; sin ese intervalo el cambio no se percibe) y sobre los resultados queda 'Volver a las preguntas'. Ese nombre lo eligió Claude: el usuario pidió 'volver a búsqueda guiada o algo así' y dijo que no se le ocurría — queda como pregunta abierta. Verificado en navegador: inicio con 2 tarjetas + 5 accesos, búsqueda 'factura' dando 4 resultados con su ruta, spinner visible, cruz vaciando la búsqueda y volviendo al inicio guiado, acceso rápido 'No tengo el número de seguimiento' aterrizando en el nodo correcto con el camino completo, y entrada desde el envío entrega_fallida mostrando sólo 2 opciones. Typecheck y build limpios, sin errores de consola en pestaña nueva."
    - "2026-09-22 (ajustes finos del usuario sobre la pantalla de V2): (1) copy: 'Tengo cuenta en MiCorreo' (no 'Tengo cuenta') y 'No tengo cuenta', SIN las descripciones que tenían debajo. (2) REGLA DE CONTENIDO, la más importante: 'limitar el listado de opciones a las que están documentadas, no podemos crear nuevas opciones'. El árbol se rehízo entero (schema_version 2): sus 19 hojas son ahora, palabra por palabra, las 19 gestiones REALES de core/gestiones/data/categorias-gestiones.json, y las agrupaciones de segundo nivel son las categorías de ese mismo archivo (Mi Cuenta 2, Paquetería Nacional 6, Franquicias 4, Fulfillment 6, Oficios Judiciales 1). Quedan fuera Paquetería Internacional y Mis Comunicaciones Digitales porque sus 8 gestiones están marcadas '(Gestión inventada)' y ya estaban ocultas por defecto en V1. Se eliminaron todos los motivos que Claude había redactado ('Todavía no llegó o está demorado', 'No se pudo entregar', 'Llegó dañado o incompleto', 'Necesito cambiar o cancelar el envío', 'Otro problema'...) y también los nodos de tipo 'informacion' (autoayuda: recuperar contraseña, crear cuenta, conseguir el número de seguimiento) junto con su soporte en el motor (NodoInformacion, ID_ALTERNATIVA, la rama de recorrer y la de la pantalla) — ninguno estaba documentado. VERIFICADO POR SCRIPT: 19 documentadas = 19 hojas, ninguna de más, ninguna sin usar, profundidad máxima exactamente 3. El script detectó y corrigió un caso: 'Oficios Judiciales' iba directo al formulario, así que la hoja era el nombre de la categoría y la gestión documentada ('Inconvenientes con el pago de oficios judiciales') quedaba sin usar; se agregó el nodo problema_oficios. (3) Acceso rápido nuevo 'Ingresar un reclamo' que va DIRECTO al formulario sin pasar por el asistente (ruta nueva /v2/reclamo, ReclamoDirectoPage). Los otros 4 accesos pasaron a ser: Mis envíos + 3 gestiones documentadas (Demora en el servicio, Inconvenientes con la entrega, Errores en mi factura). (4) FORMULARIOS DE REFERENCIA: el usuario aclaró que los formularios reales ya existen, viven en otras URLs y varían según la consulta; el prototipo ahora los rotula en pantalla como 'Formulario de referencia' con esa aclaración. Se borró el formulario 'gestion' que quedó sin uso. (5) Íconos: se instaló lucide-react (autorizado explícitamente por el usuario) reemplazando los SVG dibujados a mano; el árbol declara ids semánticos y components/Icono.tsx los resuelve, así cambiar de librería no toca el dato. (6) Sombra suave en las tarjetas (token nuevo --shadow-card-hover para el hover; reposo usa --shadow-row). Verificado en navegador: inicio, rama con cuenta (5 categorías), rama sin cuenta (6 gestiones de Paquetería Nacional), acceso directo al formulario, búsqueda 'stock' devolviendo las 6 de Fulfillment, y entrada desde un envío entregado filtrando por estado. Typecheck y build limpios, sin errores de consola."
    - "2026-09-22 (bug funcional detectado por el usuario, mismo día): en V2, entrando por 'Tengo cuenta en MiCorreo' se veían Franquicias y Fulfillment sin importar el tipo de usuario simulado en el panel 'Casos de uso'. El usuario describió la regla correcta de memoria y coincide EXACTAMENTE con la ya documentada en profile_category_visibility (categorias-gestiones.json, schema 6, definida el 2026-09-02): individuo y pyme no ven Franquicias ni Fulfillment; franquicias ve Mi Cuenta pero no Fulfillment; fulfillment no ve Franquicias y sí ve Mi Cuenta. Se cableó V2 a esa regla LEYÉNDOLA de su fuente canónica (visibleCategoriesForProfile en core/gestiones/categories.ts) en vez de copiarla al árbol — arbol.json sólo declara la 'categoria' de cada opción de segundo nivel, y el asistente pasa las categorías visibles por el contexto (clave 'categoriasVisibles'), donde opcionesVisibles() las filtra. Alcance del fix: (a) las tarjetas de agrupación; (b) el BUSCADOR, que ahora arma su índice con el mismo contexto (indiceDeHojas(contexto) + buscar(consulta, contexto)) — buscar 'stock' siendo Individuo pasó de 6 resultados a 0, que es el mismo bug que se había corregido en V1 el 2026-09-02; (c) el camino guardado en la URL: recorrer() ahora devuelve 'caminoAplicado' con las opciones que realmente se pudieron aplicar, y la pantalla construye los pasos siguientes sobre ése y no sobre el de la URL — sin esto, cambiar de perfil estando dentro de Franquicias dejaba un camino zombi al que se le seguían agregando pasos. Verificado en navegador con los 4 perfiles por deep-link (?profile=) y con el cambio en vivo desde el panel: estando en Franquicias > Errores en mi factura y pasando a Individuo, el recorrido vuelve a la pregunta de agrupación, muestra el aviso y la URL se reconstruye limpia al elegir otra opción. V1 verificada sin cambios (perfil fulfillment sigue dando 15 gestiones). Typecheck y build limpios, sin errores de consola."
    - "2026-09-22 (el usuario corrige un error conceptual propio): NO existe usuario sin cuenta que pueda llegar a esta sección — todos tienen cuenta en MiCorreo. La pregunta inicial 'tengo cuenta / no tengo cuenta' quedó inválida y se eliminó. El usuario pidió leer la documentación en detalle para decidir con qué reemplazarla, porque no podía tener toda la estructura en la cabeza a la vez, y preguntó si existen 3 temas principales o si son 5 o 6 accesos. RESPUESTA ENCONTRADA EN LA DOCUMENTACIÓN: no existe NINGÚN nivel de agrupación por encima de las categorías. mis-gestiones-categorias.md describe una base de 2 niveles (tipo de usuario → categorías; categoría → gestiones) y analisis-funcional-reclamos.md sección 5 describe el mismo recorrido; el acta del 31/08 sólo menciona la agrupación por categorías de producto/servicio. Inventar 3 'temas principales' habría sido agregar una capa que nadie definió. Decisión: el primer nivel SON las categorías documentadas. Consecuencia verificada: a Individuo/Pyme les quedan exactamente 3 tarjetas (Mi Cuenta, Paquetería Nacional, Oficios Judiciales) y a Franquicias/Fulfillment 4 — el '3' no es una elección de diseño sino el resultado de aplicar profile_category_visibility. El árbol pasó de 3 preguntas a 2 (tema → gestión), verificado por script junto con las 19 hojas = 19 gestiones documentadas. Los accesos rápidos se rehicieron: Ingresar un reclamo + Mis envíos (navegación) y 4 gestiones supuestamente de mayor uso (Demora en el servicio, Inconvenientes con la entrega, Errores en mi factura, No veo el stock) — el usuario autorizó explícitamente que la elección sea por suposición porque no hay dato de frecuencia. Los atajos que apuntan a una gestión se ocultan solos si el perfil activo no ve esa categoría: se valida recorriendo el mismo árbol, no con una lista aparte (Individuo ve 4 atajos, Franquicias 5, Fulfillment 5). Se quitó 'esUsuario' del contexto del envío (ya no hay pregunta que lo consuma) y la grilla de atajos pasó a auto-fit porque su cantidad ahora varía. Verificado en navegador con los 4 perfiles, con la entrada desde un envío (queda 1 sola pregunta) y sin errores de consola. Typecheck y build limpios."
    - "2026-09-22 (ajustes del usuario sobre los accesos rapidos y la vuelta atras de V2): (1) se ELIMINO el atajo Mis envios del inicio del asistente. Motivo textual del usuario: lleva a una ubicacion que no tenemos documentada, el listado de envios es contenido inventado (envios.json), no una pantalla relevada. En su lugar entro Paquete danado, que si es una de las 19 gestiones documentadas (paqueteria_nacional/paquete_danado). (2) Ingresar un reclamo se MOVIO al extremo derecho de la fila: es el unico atajo que saltea el recorrido guiado y el usuario pidio que fuera menos directo para la mayoria. El orden del array accesos_rapidos en arbol.json ahora es significativo y esta documentado ahi mismo. (3) NAVEGACION: al entrar a una tarjeta la unica forma de retroceder eran los breadcrumbs; se agrego un boton Volver que deshace UN paso, a la derecha de la fila de pasos, con el mismo tratamiento y la misma posicion que el Volver a las preguntas de la busqueda (pedido explicito: que la salida este siempre en el mismo lugar). Breadcrumbs y Empezar de nuevo se conservan. El atajo Ingresar un reclamo (/v2/reclamo) ya tenia su propio Volver. CONSECUENCIA PENDIENTE: /v2/envios y /v2/envios/:id quedaron huerfanas (sin entrada desde la interfaz, solo por URL directa); NO se borraron porque son la unica demostracion del reclamo contextual de la reunion de Claims. Decision abierta en propuesta-v2 seccion 7 pregunta 8. Verificado en navegador: 4 accesos para Individuo en el orden pedido y Volver funcionando a un paso desde tarjeta, atajo y formulario. Typecheck limpio."
    - "2026-09-22 (segunda vuelta sobre la misma navegacion, el usuario corrige la implementacion anterior con una captura): el Volver quedaba a la DERECHA de las migas y convivia con Empezar de nuevo. Correcciones pedidas textualmente: (1) el boton Volver va tirado a la IZQUIERDA, antes de las migas; (2) Empezar de nuevo NO deberia estar - la navegacion hacia atras se hace por breadcrumbs, y la primera miga ya vuelve al principio, asi que el boton duplicaba esa funcion y competia visualmente con el Volver (sobrevive solo dentro del EmptyState de error, donde no hay migas que tocar); (3) en la busqueda con resultados, Volver a las preguntas pasa a llamarse solo Volver y tambien va a la izquierda; (4) el contador N resultados BAJA un nivel y queda pegado arriba del listado, en vez de compartir linea con el boton. Motivo del usuario: mantener consistencia entre la busqueda por el search bar y el acceso por tarjetas - la linea de arriba dice siempre lo mismo (como salir) y el resto de la pantalla es contenido. En el codigo: .caminoBarra (que era space-between) se reemplazo por .barraVolver (flex simple con gap), se borraron .crumbReset y .resultadosBarra, y el contador se movio dentro de la rama con resultados. Verificado en navegador en los dos caminos: ?p=paqueteria_nacional,paquete_danado y ?q=paquete (6 resultados). Typecheck y build limpios."
  assumptions:
    - "El alcance v1 se enfoca en mejorar la experiencia de reclamos ya existente, no en sumar tipos de consulta nuevos"
