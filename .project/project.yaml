schema_version: "0.1"
last_updated: "2026-09-22"
target_production_date: "2026-10-07" # fuente: acta de reunión funcional N°1, 31/08/2026

project:
  name: "MiCorreo — Consultas y Reclamos"
  client: "Correo Argentino / MiCorreo"
  scenario: evolution
  local_root: "."

strategy:
  current_focus: "MVP acotado por acta de cliente (31/08/2026): rediseñar sólo la pantalla inicial de gestión de reclamos, sin tocar los formularios existentes. Fecha objetivo de producción: 07/10/2026. 2026-09-02: la sección se renombra a 'Mis gestiones' y se agrega un eje de 7 categorías de producto/servicio (chips); el tipo de usuario (ahora 4: se agregó 'Pyme') sigue existiendo y decide qué categorías son visibles — no reemplaza al tipo de usuario, es un mecanismo nuevo sobre un eje distinto (categorías, no motivos individuales)."
  intervention: hybrid # reference-existing (html reference de producción + imagen de referencia de Reclamos) + standalone-prototype (proto navegable, código nuevo)
  branches:
    v1:
      label: "Sección única de gestiones"
      status: "propuesta presentada al cliente"
      route: "/prototipo/v1"
      note: "Lo construido hasta el 2026-09-03. No se modificó al abrir V2."
    v2:
      label: "Asistente guiado (árbol de preguntas)"
      status: "alternativa en exploración"
      route: "/prototipo/v2"
      note: "Abierta el 2026-09-22 por inconformidad del cliente con V1. Fuera del MVP con fecha 07/10/2026 — ver el conflicto de alcance en documentation/propuesta-v2-reclamo-contextual.md sección 6."
  recommended_next:
    - "Validar con el negocio el árbol de preguntas de V2 (proto navegable/src/v2/data/arbol.json): su orden y agrupamiento son la propuesta entera, y hoy son hipótesis de diseño, no un dato."
    - "Definir con el cliente si V2 reemplaza, complementa o descarta a V1 antes de invertir más en cualquiera de las dos — hoy conviven a propósito, sin decisión tomada."
    - "Si V2 avanza: renegociar la fecha de producción del 07/10/2026, porque V2 rediseña formularios y el acta del 31/08 los dejó explícitamente fuera del MVP."
    - "Validar con el negocio las asignaciones 'por intuición' de gestiones a Mi Cuenta/Paquetería Nacional/Oficios Judiciales, y conseguir contenido real para Paquetería Internacional y Mis Comunicaciones Digitales (hoy con 4 gestiones inventadas cada una) — ver documentation/mis-gestiones-categorias.md sección 9."
    - "Validar con el negocio si las 5 categorías sin exclusión mencionada (Mi Cuenta, Paquetería Nacional, Paquetería Internacional, Mis Comunicaciones Digitales, Oficios Judiciales) son realmente visibles para los 4 tipos de usuario por igual."
    - "Confirmar que el alcance del prototipo respeta el acuerdo del acta: NO rediseñar los formularios particulares de cada gestión en esta entrega (siguen siendo el formulario actual) — sólo la pantalla inicial de acceso/navegación."
    - "Si se edita cualquier documentation/*.md, o cualquiera de los data/*.json que ahora viven sólo dentro de proto navegable/src/core/*/data/ (categorias-gestiones.json, motivos-reclamo-por-perfil.json, visibilidad-perfiles.json — consolidados 2026-09-02, ya no hay copia en documentation/data/), recordar copiar el cambio también a hub/downloads/ y a las páginas .html del Hub que lo renderizan (no hay build step que los mantenga sincronizados solo)"
    - "Diseñar/construir la pantalla de detalle de una gestión — hoy las filas del listado sólo muestran un Toast placeholder (ver nota del acta: por ahora se mantiene el formulario actual, este punto queda en espera de esa definición)"
    - "Cuando el usuario quiera avanzar: cerrar las definiciones de la sección 4 de documentation/brief-consultas-reclamos.md antes de seguir sumando pantallas de negocio"
    - "Convención de documentación (pedido explícito del usuario): cuando una regla de negocio venga marcada como propensa a cambiar seguido, documentarla con fecha de vigencia explícita y mantenerla en datos (JSON) separados de la lógica, para que un cambio futuro sea editar un dato, no reescribir código o prosa."
  deferred:
    - "Definición de alcance de negocio (tipos de consulta, qué es 'administrar consultas') — usuario pidió dejarla abierta por ahora"
    - "IA para detección de motivo por texto libre — visión a futuro explícitamente fuera del MVP según el acta del 31/08/2026"
    - "Nombre definitivo de la sección: 'Mis gestiones' es el nombre actual, pero el usuario avisó que es probable que se vuelva a renombrar — no dar por definitivo"
    - "Matriz motivo×perfil (core/reclamos/reasonProfiles.ts, profileVisibility.ts): sigue sin uso — el mecanismo de tipo de usuario que SÍ está activo (core/gestiones/categories.ts) es un código nuevo, no una reactivación de estos archivos"

