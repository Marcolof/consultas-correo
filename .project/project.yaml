schema_version: "0.1"
last_updated: "2026-09-01"

project:
  name: "MiCorreo — Consultas y Reclamos"
  client: "Correo Argentino / MiCorreo"
  scenario: evolution
  local_root: "."

strategy:
  current_focus: "Documentación del Hub puesta al día (4 documentos, no 2) y todo el trabajo acumulado de la sesión pusheado a GitHub."
  intervention: hybrid # reference-existing (html reference de producción + imagen de referencia de Reclamos) + standalone-prototype (proto navegable, código nuevo)
  recommended_next:
    - "Usuario: crear un SEGUNDO proyecto Vercel apuntando al mismo repo, con Root Directory = 'proto navegable' (Vite se autodetecta), para publicar el prototipo por separado"
    - "Cuando exista la URL del segundo proyecto: actualizar el href de la card 'Prototipo navegable' en hub/index.html (hoy apunta a localhost:4300, marcado con TODO) y el HUB_URL de proto navegable/src/app/HubAccessButton.tsx (hoy apunta a localhost:4311/)"
    - "Si se edita cualquier documentation/*.md o data/*.json, recordar copiar los cambios también a hub/downloads/ y a las páginas .html del Hub que los renderizan (no hay build step que los mantenga sincronizados solo)"
    - "Diseñar/construir la pantalla de detalle de un reclamo — hoy las filas del listado sólo muestran un Toast placeholder"
    - "Cuando el usuario quiera avanzar: cerrar las definiciones de la sección 4 de documentation/brief-consultas-reclamos.md (ahora con 2 preguntas más sobre determinación de perfil) antes de seguir sumando pantallas de negocio"
    - "Si se autoriza Figma, leer 'Mi Correo 2.0' como referencia de pantallas nuevas"
  deferred:
    - "Definición de alcance de negocio (tipos de consulta, qué es 'administrar consultas') — usuario pidió dejarla abierta por ahora"
    - "Sincronización con Figma 'Mi Correo 2.0' — sin acceso autorizado al MCP de Figma en esta sesión"
    - "Segundo proyecto Vercel para 'proto navegable' — requiere que el usuario lo cree desde su cuenta"

knowledge:
  confirmed:
    - "html reference/reclaclamos.html es la pantalla de alta de reclamo en producción (2 pasos: motivo del reclamo + búsqueda del envío por filtros)"
    - "proto navegable replica chrome, tokens y primitivos de UI del proyecto de referencia 'Envio internacional CLAUDE', sin ninguna lógica de negocio"
    - "documentation/guia-de-estilos-ui.md documenta tokens, chrome e inventario de componentes de proto navegable"
    - "2026-08-31: la carpeta se renombró de 'mlof-ui-base' a 'proto navegable' a pedido del usuario, de cara a subir el proyecto a GitHub. El nombre del paquete npm quedó como 'proto-navegable' (equivalente válido sin espacios); package-lock.json, README.md, documentation/*.md, hub/*.html y el launch.json de la sesión se actualizaron para reflejar el nuevo nombre."
    - "2026-09-01: repo git inicializado en la raíz de 'Reclamos claude' y publicado en https://github.com/Marcolof/consultas-correo (público). Excluye 'html reference/' (dominio interno + token de sesión embebido) y 'Font gilroy/' + los .ttf dentro de proto navegable/src/assets/fonts (fuente comercial sin licencia de redistribución pública) — decisión explícita del usuario. Verificado en GitHub que los 4 elementos de raíz (.project, documentation, hub, proto navegable) llegaron al remoto."
    - "2026-09-01: usuario confirmó que el Hub debe ser la raíz pública del proyecto. Se quitó <base href=\"/hub/\"> de las 4 páginas de hub/ (sólo tenía sentido cuando el Hub vivía en un subpath) y se corrigió el link del footer de index.html para apuntar al blob de GitHub en vez de una ruta relativa fuera de hub/. El servidor local (reclamos-hub, puerto 4311) ahora sirve la carpeta hub/ directamente como raíz — deja de servir toda 'Reclamos claude' — para que el comportamiento local sea idéntico al de producción."
    - "2026-09-01: con autorización del usuario (sesión de Vercel ya abierta en el navegador de Claude), se configuró Root Directory='hub' en el proyecto Vercel 'consultas-correo-v1' y se disparó un Redeploy manual (cambiar Root Directory no redeploya solo). Verificado en vivo: https://consultas-correo-v1.vercel.app muestra el Hub y navega correctamente (index → documentación → doc → volver)."
    - "2026-09-01: usuario proveyó definición funcional (JSON, schema_version 1) confirmando que el negocio distingue 3 perfiles de usuario (fulfillment, franquicias, individuo) con subconjuntos distintos de motivos de reclamo visibles — dato de negocio real, no inferencia. Documentado en documentation/motivos-reclamo-por-perfil.md + data/motivos-reclamo-por-perfil.json. Contrasta con reclaclamos.html, que muestra los motivos sin diferenciar perfil."
    - "2026-09-01: 'proto navegable es la base sobre la que se construirán las pantallas de Consultas/Reclamos' quedó CONFIRMADO por la acción del usuario (pidió construir la primera pantalla ahí) — ya no es supuesto, se retira de 'assumptions'."
    - "2026-09-01: construida ReclamosListPage (ruta '/'), basada en imagen de referencia + datos reales de perfil. Agregados a shared/ui: ChipGroup, NavListItem, SearchInput (+ tokens --chip-*/--nav-list-item-*/--search-input-*). HubAccessButton ahora abre un menú (Volver al Hub / Casos de uso); 'Casos de uso' es un Modal con selector de perfil activo (core/session/activeUseCase.ts). Detalle en documentation/pantalla-reclamos-listado.md."
    - "2026-09-01 (corrección, misma sesión que el ítem anterior): el usuario aclaró que 'Casos de uso' NO debe definir qué chip viene preseleccionado — el chip por defecto siempre es 'Todos'. En cambio, el perfil activo define qué CHIPS EXISTEN para ese usuario (regla nueva de negocio, distinta de la matriz motivo×perfil): Individuo ve sólo Todos/Individuo; Franquicias ve Todos/Individuo/Franquicias; Fulfillment ve Todos/Individuo/Fulfillment. Documentado en documentation/motivos-reclamo-por-perfil.md sección 6 + data/visibilidad-perfiles.json. Implementado en core/reclamos/profileVisibility.ts (data-driven, no hardcodeado) y ReclamosListPage (si el chip elegido deja de ser válido al cambiar de caso de uso, vuelve a 'Todos'). Verificado en navegador con los 3 perfiles + el reseteo automático."
    - "2026-09-01: agregada sección 'Pantalla' al panel 'Casos de uso' (Modal subido de size sm a md) con switch 'Responsive' (core/session/forcedViewport.ts, mismo patrón que activeUseCase.ts). Al activarlo aplica una clase global 'force-mobile' (AppShell.tsx) que fuerza el mismo estado que el breakpoint real de 768px en Header/Sidebar/AppShell, sin depender del ancho real de la ventana: riel del Sidebar oculto, header vacío salvo hamburguesa (logo/Nuevo envío/usuario se ocultan — antes sólo se ocultaba el texto de usuario, ahora TODO el bloque, corrigiendo también el breakpoint real para que no diverja del forzado), cajón con el árbol completo (Panel, Mis envíos, Servicios, Mi saldo, Integraciones, Mi cuenta, Nuevo envío) igual a la imagen de referencia del usuario. Verificado en navegador con la ventana en tamaño desktop real. Documentado en pantalla-reclamos-listado.md sección 5."
    - "2026-09-01 (ajuste sobre el ítem anterior, mismo día): el usuario pidió que el switch 'Responsive' angoste efectivamente el ancho visible, no sólo reacomode el layout. Se logró con `transform: translateZ(0)` en el wrapper `force-mobile` (AppShell.module.css) + `max-width: 390px` + `margin: 0 auto` — un `transform` distinto de `none` convierte al elemento en el containing block de sus descendientes `position: fixed` (Header, riel del Sidebar, ChatBubble, HubAccessButton), que dejan de posicionarse contra la ventana real y pasan a posicionarse contra esos 390px. El Modal 'Casos de uso' queda afuera del efecto a propósito (se renderiza en portal a <body>, fuera del wrapper) — el panel de control sigue a tamaño normal mientras el contenido controlado se ve angosto. Verificado en navegador: pantalla completa se angosta y centra con sombra, el cajón mobile y los botones flotantes quedan contenidos dentro del marco angosto. Build de producción limpio."
    - "2026-09-01: se agregaron hub/motivos-reclamo-por-perfil.html y hub/pantalla-reclamos-listado.html (transcripción HTML fiel de los .md, mismo patrón visual del Hub) — documentacion.html pasó de 2 a 4 cards, todas con botón de Descargar (.md real, copiado a hub/downloads/). READMEs (raíz y proto navegable) corregidos: ya no dicen 'sin funcionalidad de negocio', reflejan que existe la pantalla de Reclamos real."
    - "2026-09-01: todo el trabajo acumulado de la sesión (Reclamos, Casos de uso, modo responsive, documentación del Hub) commiteado y pusheado a https://github.com/Marcolof/consultas-correo (commit c737546). Verificado en GitHub (6 commits en main) y en producción: https://consultas-correo-v1.vercel.app/documentacion.html ya muestra las 4 cards — el deploy automático de Vercel por push a main funcionó sin intervención manual."
  assumptions:
    - "El alcance v1 se enfoca en mejorar la experiencia de reclamos ya existente, no en sumar tipos de consulta nuevos"
    - "SUPERSEDED (2026-09-01, ver knowledge.confirmed): 'el filtro arranca en el perfil activo' — el usuario corrigió esto en la misma sesión. El comportamiento real es: filtro siempre en 'Todos', el perfil activo controla qué chips existen, no cuál viene elegido."
    - "'Todos' sigue mostrando la unión completa de motivos (19) sin importar el perfil activo — la regla de visibilidad de chips (sección 6 de motivos-reclamo-por-perfil.md) restringe qué CHIPS existen, no qué trae 'Todos'. No confirmado explícitamente que deba ser así para siempre; queda como pregunta abierta."
  open_questions:
    - "¿Qué tipos de consulta existen más allá del alta de reclamo (seguimiento, listado, edición, historial)?"
    - "¿Qué significa 'administrar consultas' en este proyecto y qué acciones comprende?"
    - "¿Cómo se determina el perfil (fulfillment/franquicias/individuo) de un usuario logueado? ¿Puede tener más de uno? ¿Qué pasa si no matchea ninguno? (ver documentation/motivos-reclamo-por-perfil.md, sección 6)"
    - "¿Los 3 perfiles son estables o se espera que se agreguen más pronto? (el usuario mencionó 'podría ampliarse')"
    - "¿El chip 'Todos' debería acotarse también según el perfil activo (mostrar sólo la unión de lo que ese perfil puede ver), o se mantiene siempre como el universo completo de motivos como está hoy?"

