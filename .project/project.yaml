artifacts:
  hub:
    status: draft
    path: "hub/index.html"
    structure: "Hub con 2 opciones (Prototipo, Documentación). Documentación abre hub/documentacion.html con 4 cards (brief.html, guia-de-estilos.html, motivos-reclamo-por-perfil.html, pantalla-reclamos-listado.html); cada doc vuelve con flecha a documentacion.html, y ésta vuelve con flecha a index.html"
    provider: fallback
    served_via: "reclamos-hub (npx serve, puerto 4311, apuntando directo a la carpeta hub/) — ver .claude/launch.json en la carpeta outputs de la sesión"
    note: "El Hub es la raíz pública prevista del proyecto (Vercel: Root Directory = 'hub'). La card 'Prototipo navegable' en index.html todavía apunta a localhost:4300 (marcado con TODO) hasta que exista la URL del segundo proyecto Vercel de proto navegable. Botón 'Descargar' en las 4 cards de documentacion.html y en la esquina superior derecha de cada detalle (misma fila que 'Volver a Documentación'). Descarga el .md real (y los .json de datos, para los 2 docs de negocio), no un extracto: copiados a hub/downloads/ porque Vercel (Root Directory='hub') no incluye documentation/ en el deploy. Estas copias hay que mantenerlas sincronizadas a mano si el original cambia. Estructura de card con botón: dejó de ser <a class=\"card\"> entera (no se puede anidar un <a> de descarga adentro); ahora es <div class=\"card card--doc\"> con el título como <a class=\"card-link\"> estirado (.card-link::after) y el botón de descarga como hermano con z-index mayor. 2026-09-01: agregadas motivos-reclamo-por-perfil.html y pantalla-reclamos-listado.html (transcripción HTML fiel de los .md, mismo patrón visual) — el Hub ya no estaba desactualizado."
    last_updated: "2026-09-01"
  prototype:
    status: draft
    fidelity: high # chrome/tokens con fidelidad alta; ya tiene 1 pantalla de negocio real (Reclamos)
    path: "proto navegable"
    provider: fallback
    note: "2026-09-01: primera pantalla real (ReclamosListPage, ruta '/'), basada en imagen de referencia del usuario + datos reales de motivos-reclamo-por-perfil.json. Se agregaron 3 primitivos nuevos a shared/ui (ChipGroup, NavListItem, SearchInput) y 3 grupos de tokens nuevos (--chip-*, --nav-list-item-*, --search-input-*) — documentados en guia-de-estilos-ui.md. HubAccessButton dejó de ser un link directo: ahora abre un menú con 'Volver al Hub' y 'Casos de uso' (Modal con ChipGroup de perfil activo — core/session/activeUseCase.ts). StarterPage.tsx eliminado (reemplazado por la pantalla real). CORREGIDO en la misma sesión: el filtro de chips siempre arranca en 'Todos'; el perfil activo controla qué chips existen (core/reclamos/profileVisibility.ts, data-driven), no cuál viene elegido — si el chip elegido deja de ser válido al cambiar de caso de uso, vuelve a 'Todos' solo. Typecheck y build de producción verificados sin errores; verificado en navegador con los 3 perfiles (2 chips para Individuo, 3 para Franquicias, 3 para Fulfillment) y el reseteo automático."
    last_updated: "2026-09-01"
