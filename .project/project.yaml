    purpose: "Origen de tokens, chrome y componentes extraídos a proto navegable"
    confidence: high
  - type: figma
    location: "Mi Correo 2.0 (fileKey wN6vAlF1TgGc2AJdJJvsAU) — registrado en memoria de usuario"
    purpose: "Referencia de pantallas nuevas (no de lo ya existente)"
    confidence: unknown # sin verificar en esta sesión: MCP de Figma no autorizado
  - type: functional-definition
    location: "documentation/data/motivos-reclamo-por-perfil.json (pegado por el usuario en el chat el 2026-09-01, guardado tal cual como snapshot)"
    purpose: "Regla de negocio real: qué motivos de reclamo ve cada perfil de usuario (fulfillment/franquicias/individuo)"
    confidence: high # provisto directamente por el usuario como definición funcional confirmada
  - type: functional-definition
    location: "documentation/data/visibilidad-perfiles.json (descripta en prosa por el usuario el 2026-09-01, formalizada por Claude como JSON siguiendo el mismo criterio del archivo anterior)"
    purpose: "Regla de negocio real, distinta de la anterior: qué chips de tipo de reclamo puede ver cada perfil activo (visibilidad de perfiles entre sí, no de motivos)"
    confidence: high # ejemplos A/B/C dados explícitamente por el usuario, no inferidos

