    - "V2 · ¿Qué otras entidades además del envío (facturación, saldo, sellos digitales, oficios judiciales, integraciones) deberían tener entrada contextual, y en qué orden?"
    - "V2 · ¿Qué datos puede precargar realmente el sistema en cada formulario? El prototipo asume que todo lo visible en el detalle del envío está disponible."
    - "V2 · ¿Los casos de autoayuda que cierran SIN generar reclamo (recuperar contraseña, crear cuenta, conseguir el número de seguimiento) son aceptables para el negocio, o prefiere abrir reclamo siempre?"
    - "V2 · ¿Qué debe pasar cuando un envío ya tiene un reclamo abierto? Hoy se avisa pero no se impide abrir otro."
    - "V1 vs V2 · ¿El cliente elige una, pide una tercera, o las combina? Ninguna decisión tomada: conviven a propósito."
    - "¿Las asignaciones 'por intuición' de gestiones a Mi Cuenta, Paquetería Nacional y Oficios Judiciales son correctas? Ver documentation/mis-gestiones-categorias.md sección 4 — necesita validación del negocio."
    - "¿Qué gestiones reales van a completar Paquetería Internacional y Mis Comunicaciones Digitales (hoy con contenido inventado)?"
    - "¿Las 5 categorías sin exclusión mencionada (Mi Cuenta, Paquetería Nacional, Paquetería Internacional, Mis Comunicaciones Digitales, Oficios Judiciales) son realmente visibles para los 4 tipos de usuario por igual, o hay exclusiones adicionales que no se mencionaron?"
    - "Motivos que antes eran transversales a los 3 perfiles ('Errores en mi factura', 'Errores con el saldo de mi cuenta') ahora sólo figuran en la categoría Franquicias — ¿deberían aparecer también en Fulfillment y/o Mi Cuenta?"
    - "¿'Pyme' tiene alguna diferencia de negocio real con 'Individuo' más allá del nombre, o son equivalentes hoy (mismas categorías visibles, sin gestiones propias documentadas)?"
    - "¿Cómo se determina el tipo de usuario (Individuo/Pyme/Franquicias/Fulfillment) de un usuario logueado en producción? ¿Puede tener más de uno?"
    - "¿Qué tipos de consulta existen más allá de la gestión (seguimiento, listado, edición, historial)?"
    - "¿Qué significa 'administrar consultas' en este proyecto y qué acciones comprende?"
    - "¿Cómo se define la pantalla de detalle de una gestión (hoy inexistente): qué datos muestra, qué acciones permite?"
    - "¿Cómo se va a comprobar que esta primera entrega aporta valor (criterio de aceptación)?"
    - "Nombre definitivo de la sección: ¿'Mis gestiones' queda firme o vuelve a cambiar? (el propio usuario avisó que es probable)."
    - "¿Llegaron ya la documentación CG01 (a cargo de MC, Anabella/Wanda) y CG05 (a cargo de Proyecto ED), ambas con fecha límite 4/9/2026? No están en este repo todavía."
    - "¿Los tags de búsqueda generados por Claude (proto navegable/src/core/gestiones/data/categorias-gestiones.json, campo 'tags') son razonables, o el negocio quiere revisarlos/reemplazarlos? Ninguno fue validado."
    - "¿El tag especial de categoría ('fulfillment'/'franquicia', que hace que buscar esa palabra muestre todas las gestiones de la categoría sin tocar el chip) debería extenderse a las otras 5 categorías, o queda exclusivo de Fulfillment/Franquicias por ahora?"
    - "2026-09-03: la búsqueda ahora es permisiva (alcanza con que una palabra de la frase matchee, ranking por relevancia) en vez de exigir todas — ¿el negocio prefiere este comportamiento amplio o uno más estricto?"
    - "2026-09-03: Paquetería Internacional y Mis Comunicaciones Digitales quedaron ocultas por defecto (switch para reactivarlas) hasta tener contenido real — ¿el negocio prefiere directamente no mostrarlas en ninguna demo hasta entonces, o el switch actual (visible en el panel de tooling) es suficiente?"

