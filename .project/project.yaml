schema_version: "0.1"
last_updated: "2026-09-01"

project:
  name: "MiCorreo — Consultas y Reclamos"
  client: "Correo Argentino / MiCorreo"
  scenario: evolution
  local_root: "."

strategy:
  current_focus: "Arquitectura de deploy definida: el Hub es la raíz pública del proyecto (consultas-correo-v1), 'proto navegable' necesita su PROPIO proyecto Vercel aparte. Falta que el usuario cree ese segundo proyecto y confirme la URL resultante."
  intervention: hybrid # reference-existing (html reference de producción) + standalone-prototype (proto navegable, código nuevo)
  recommended_next:
    - "Usuario: en el proyecto Vercel existente 'consultas-correo-v1', cambiar Root Directory a 'hub' (framework 'Other', sin build command) y redeployar — esto hace que el Hub sea la raíz pública"
    - "Usuario: crear un SEGUNDO proyecto Vercel apuntando al mismo repo, con Root Directory = 'proto navegable' (Vite se autodetecta), para publicar el prototipo por separado"
    - "Cuando exista la URL del segundo proyecto: actualizar el href de la card 'Prototipo navegable' en hub/index.html (hoy apunta a localhost:4300, marcado con TODO) y el HUB_URL de proto navegable/src/app/HubAccessButton.tsx (hoy apunta a localhost:4311/)"
    - "Cuando el usuario quiera avanzar: cerrar las definiciones de la sección 4 de documentation/brief-consultas-reclamos.md antes de construir pantallas de negocio"
    - "Si se autoriza Figma, leer 'Mi Correo 2.0' como referencia de pantallas nuevas"
  deferred:
    - "Definición de alcance de negocio (tipos de consulta, qué es 'administrar consultas') — usuario pidió dejarla abierta por ahora"
    - "Sincronización con Figma 'Mi Correo 2.0' — sin acceso autorizado al MCP de Figma en esta sesión"
    - "Segundo proyecto Vercel para 'proto navegable' — requiere que el usuario lo cree desde su cuenta"

knowledge:
  confirmed:
    - "html reference/reclaclamos.html es la pantalla de alta de reclamo en producción (2 pasos: motivo del reclamo + búsqueda del envío por filtros)"
    - "proto navegable replica chrome, tokens y primitivos de UI del proyecto de referencia 'Envio internacional CLAUDE', sin ninguna lógica de negocio"
    - "documentation/guia-de-estilos-ui.md documenta tokens, chrome e inventario de componentes de proto navegable"
    - "2026-08-31: la carpeta se renombró de 'mlof-ui-base' a 'proto navegable' a pedido del usuario, de cara a subir el proyecto a GitHub. El nombre del paquete npm quedó como 'proto-navegable' (equivalente válido sin espacios); package-lock.json, README.md, documentation/*.md, hub/*.html y el launch.json de la sesión se actualizaron para reflejar el nuevo nombre."
    - "2026-09-01: repo git inicializado en la raíz de 'Reclamos claude' y publicado en https://github.com/Marcolof/consultas-correo (público). Excluye 'html reference/' (dominio interno + token de sesión embebido) y 'Font gilroy/' + los .ttf dentro de proto navegable/src/assets/fonts (fuente comercial sin licencia de redistribución pública) — decisión explícita del usuario. Verificado en GitHub que los 4 elementos de raíz (.project, documentation, hub, proto navegable) llegaron al remoto."
    - "2026-09-01: usuario confirmó que el Hub debe ser la raíz pública del proyecto. Se quitó <base href=\"/hub/\"> de las 4 páginas de hub/ (sólo tenía sentido cuando el Hub vivía en un subpath) y se corrigió el link del footer de index.html para apuntar al blob de GitHub en vez de una ruta relativa fuera de hub/. El servidor local (reclamos-hub, puerto 4311) ahora sirve la carpeta hub/ directamente como raíz — deja de servir toda 'Reclamos claude' — para que el comportamiento local sea idéntico al de producción."
  assumptions:
    - "proto navegable es la base sobre la que se construirán las pantallas de Consultas/Reclamos (no confirmado explícitamente por el usuario)"
    - "El alcance v1 se enfoca en mejorar la experiencia de reclamos ya existente, no en sumar tipos de consulta nuevos"
  open_questions:
    - "¿Qué tipos de consulta existen más allá del alta de reclamo (seguimiento, listado, edición, historial)?"
    - "¿Qué significa 'administrar consultas' en este proyecto y qué acciones comprende?"
    - "¿proto navegable pasa a ser el repo del prototipo de Reclamos, o queda como base compartida y el prototipo real vive en otra carpeta?"

sources:
  - type: legacy-html
    location: "html reference/reclaclamos.html"
    purpose: "Fidelidad visual y de comportamiento de la pantalla de alta de reclamo en producción"
    confidence: high
  - type: reference-codebase
    location: "../Envios internacionales/Envio internacional CLAUDE (fuera de la raíz de este proyecto, sólo lectura)"
    purpose: "Origen de tokens, chrome y componentes extraídos a proto navegable"
    confidence: high
  - type: figma
    location: "Mi Correo 2.0 (fileKey wN6vAlF1TgGc2AJdJJvsAU) — registrado en memoria de usuario"
    purpose: "Referencia de pantallas nuevas (no de lo ya existente)"
    confidence: unknown # sin verificar en esta sesión: MCP de Figma no autorizado

