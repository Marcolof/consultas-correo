    - "2026-09-01: construida ReclamosListPage (ruta '/'), basada en imagen de referencia + datos reales de perfil. Agregados a shared/ui: ChipGroup, NavListItem, SearchInput (+ tokens --chip-*/--nav-list-item-*/--search-input-*). HubAccessButton ahora abre un menú (Volver al Hub / Casos de uso); 'Casos de uso' es un Modal con selector de perfil activo (core/session/activeUseCase.ts). Detalle en documentation/pantalla-reclamos-listado.md."
    - "2026-09-01 (corrección, misma sesión que el ítem anterior): el usuario aclaró que 'Casos de uso' NO debe definir qué chip viene preseleccionado — el chip por defecto siempre es 'Todos'. En cambio, el perfil activo define qué CHIPS EXISTEN para ese usuario (regla nueva de negocio, distinta de la matriz motivo×perfil): Individuo ve sólo Todos/Individuo; Franquicias ve Todos/Individuo/Franquicias; Fulfillment ve Todos/Individuo/Fulfillment. Documentado en documentation/motivos-reclamo-por-perfil.md sección 6 + data/visibilidad-perfiles.json. Implementado en core/reclamos/profileVisibility.ts (data-driven, no hardcodeado) y ReclamosListPage (si el chip elegido deja de ser válido al cambiar de caso de uso, vuelve a 'Todos'). Verificado en navegador con los 3 perfiles + el reseteo automático."
    - "2026-09-01: agregada sección 'Pantalla' al panel 'Casos de uso' (Modal subido de size sm a md) con switch 'Responsive' (core/session/forcedViewport.ts, mismo patrón que activeUseCase.ts). Al activarlo aplica una clase global 'force-mobile' (AppShell.tsx) que fuerza el mismo estado que el breakpoint real de 768px en Header/Sidebar/AppShell, sin depender del ancho real de la ventana: riel del Sidebar oculto, header vacío salvo hamburguesa (logo/Nuevo envío/usuario se ocultan — antes sólo se ocultaba el texto de usuario, ahora TODO el bloque, corrigiendo también el breakpoint real para que no diverja del forzado), cajón con el árbol completo (Panel, Mis envíos, Servicios, Mi saldo, Integraciones, Mi cuenta, Nuevo envío) igual a la imagen de referencia del usuario. Verificado en navegador con la ventana en tamaño desktop real. Documentado en pantalla-reclamos-listado.md sección 5."
    - "2026-09-01 (ajuste sobre el ítem anterior, mismo día): el usuario pidió que el switch 'Responsive' angoste efectivamente el ancho visible, no sólo reacomode el layout. Se logró con `transform: translateZ(0)` en el wrapper `force-mobile` (AppShell.module.css) + `max-width: 390px` + `margin: 0 auto` — un `transform` distinto de `none` convierte al elemento en el containing block de sus descendientes `position: fixed` (Header, riel del Sidebar, ChatBubble, HubAccessButton), que dejan de posicionarse contra la ventana real y pasan a posicionarse contra esos 390px. El Modal 'Casos de uso' queda afuera del efecto a propósito (se renderiza en portal a <body>, fuera del wrapper) — el panel de control sigue a tamaño normal mientras el contenido controlado se ve angosto. Verificado en navegador: pantalla completa se angosta y centra con sombra, el cajón mobile y los botones flotantes quedan contenidos dentro del marco angosto. Build de producción limpio."
    - "2026-09-01: se agregaron hub/motivos-reclamo-por-perfil.html y hub/pantalla-reclamos-listado.html (transcripción HTML fiel de los .md, mismo patrón visual del Hub) — documentacion.html pasó de 2 a 4 cards, todas con botón de Descargar (.md real, copiado a hub/downloads/). READMEs (raíz y proto navegable) corregidos: ya no dicen 'sin funcionalidad de negocio', reflejan que existe la pantalla de Reclamos real."
    - "2026-09-01: todo el trabajo acumulado de la sesión (Reclamos, Casos de uso, modo responsive, documentación del Hub) commiteado y pusheado a https://github.com/Marcolof/consultas-correo (commit c737546). Verificado en GitHub (6 commits en main) y en producción: https://consultas-correo-v1.vercel.app/documentacion.html ya muestra las 4 cards — el deploy automático de Vercel por push a main funcionó sin intervención manual."
    - "2026-09-02: 4 ajustes de UI en ReclamosListPage a pedido del usuario: contador dice 'reclamos' (antes 'consultas'), filas del listado sin sombra (sólo fondo + borde), se quitó el título 'Tipos de Reclamos' sobre los chips, y el SearchBar pasó de totalmente redondeado a radio 12px (nuevo token --radius-md-lg) por fidelidad con la propuesta de Figma. Commiteado y pusheado (commit ade88e6)."
    - "2026-09-02: corregido alineado de PageContainer — en pantallas anchas ya no centra su contenido (se sacó margin:0 auto de .narrow), y el padding horizontal en desktop se ajustó a 3rem (--space-12) por fidelidad con la web real de MiCorreo (verificado con captura de producción del usuario, clase .px-5 de Bootstrap = 3rem). Se agregó también el override :global(.force-mobile) que faltaba, para que el modo responsive forzado del prototipo (que no cambia el ancho real de la ventana) use el padding mobile real (16px) en vez de heredar el de desktop."
    - "2026-09-02: usuario notó que la card 'Prototipo navegable' del Hub deployado apuntaba a localhost. Se creó el segundo proyecto Vercel del repo usando el atajo de import que Vercel ya sugería (Root Directory='proto navegable', Vite autodetectado) — nombre normalizado a 'proto-navegable' por validación de Vercel (minúsculas, sin espacio). Deployado y verificado en vivo: https://proto-navegable.vercel.app muestra la pantalla real de Reclamos con todos los ajustes de la sesión. Actualizados hub/index.html (href de la card) y HubAccessButton.tsx (HUB_URL ahora apunta a https://consultas-correo-v1.vercel.app/ en vez de localhost). Nota: existe un tercer proyecto 'consultas-correo' (sin sufijo) auto-creado por Vercel apuntando a la raíz del repo (404) — se dejó sin usar, no se tocó ni se borró."
    - "2026-09-02: creado documentation/analisis-funcional-reclamos.md — documento nuevo, consolida (no reemplaza) brief + motivos-reclamo-por-perfil + pantalla-reclamos-listado en formato de lectura rápida para un Analista Funcional (AFU): objetivo, alcance, perfiles, reglas de negocio (A y B), flujo funcional paso a paso, preguntas pendientes de definición y tabla de trazabilidad de fuentes. Agregado al Hub como 5ta card de documentacion.html (hub/analisis-funcional-reclamos.html + hub/downloads/analisis-funcional-reclamos.md). De paso se actualizaron pantalla-reclamos-listado.md y su .html en el Hub para reflejar los 4 ajustes de UI del ítem anterior (quedaban desactualizados)."
    - "2026-09-02: analizado 'docs externos/31_08_2026_ACT Relevamiento Inicial de Gestion de Reclamos.docx.pdf' — acta real de la Reunión funcional N°1 (31/08/2026) entre MC (Anabella Prado, Wanda Regina De Virgilio) y Proyecto ED (Agustina Gualco, Marco Laforte, Marcela Demichelis), elaborada por Marcela Demichelis. Confirma varias cosas de negocio que NO teníamos documentadas: (1) el MVP es explícitamente 'rediseñar la pantalla inicial de Reclamos' manteniendo intactos los motivos y los FORMULARIOS particulares de cada reclamo existentes — el rediseño de esos formularios queda para una etapa posterior, fuera de este MVP; (2) hay una fecha objetivo de producción: 07/10/2026, con el compromiso de cerrar el alcance inicial 'durante esta semana' (a partir del 31/08/2026); (3) hay un compromiso explícito, mismo día del acta: 'Marcos + Marcela mostrar una propuesta visual inicial de la pantalla inicial de la sección Reclamos' — coincide con el trabajo ya hecho en el prototipo y en Figma; (4) IA (que el usuario escriba libre y el sistema detecte el motivo) es visión a futuro EXPLÍCITAMENTE fuera del MVP; (5) se está evaluando además un renombre de la sección 'Reclamos' (alternativa mencionada: 'Contacto'), sin decidir; (6) se presentó un trabajo preliminar de AGRUPACIÓN de motivos por categorías de producto/servicio — 'Franquicias, Paquetería, Fulfillment, Mi cuenta' — que es un eje DISTINTO del que ya tenemos implementado (perfil de usuario: Individuo/Franquicias/Fulfillment); no está claro si reemplaza, complementa o convive con la regla de perfiles ya construida — ver open_questions. (7) MC debe entregar documentación 'CG01' y Proyecto ED documentación 'CG05', ambas con fecha límite viernes 4/9/2026 — todavía no llegaron, no están en este repo."
    - "2026-09-02: confirmado que 'docs externos/motivos_reclamo_config.json' es un archivo EXTERNO real (no inventado en el chat) con el mismo contenido exacto que documentation/data/motivos-reclamo-por-perfil.json (mismos 3 perfiles, mismos 19 motivos, mismo mapeo) — corrobora la autoridad del dato ya documentado, no aporta información nueva."
    - "2026-09-02 (definición grande del usuario, misma sesión que el análisis del acta): (1) la sección cambia de nombre de 'Reclamos' a 'Mis gestiones' — el usuario avisó explícitamente que es probable que este nombre se vuelva a cambiar, así que se implementó como una única constante editable (proto navegable/src/core/gestiones/sectionLabel.ts: SECTION_LABEL/ITEM_LABEL_SINGULAR/ITEM_LABEL_PLURAL) en vez de hardcodear el texto en cada lugar. (2) El eje de filtro de la pantalla pasa de perfil de usuario a 7 CATEGORÍAS de producto/servicio (chips): Mi Cuenta, Paquetería Nacional, Paquetería Internacional, Franquicias, Fulfillment, Mis Comunicaciones Digitales, Oficios Judiciales — esto RESUELVE la pregunta abierta que había quedado del acta del 31/08 sobre si la categorización convivía con el eje de perfil; la respuesta es que la categorización LO REEMPLAZA para esta pantalla. (3) Sólo Franquicias (6 gestiones dadas por el usuario) y Fulfillment (4 gestiones dadas por el usuario) tienen contenido textualmente confirmado por el negocio — dato de negocio real, documentado en documentation/mis-gestiones-categorias.md. (4) Las otras 5 categorías se completaron por decisión de Claude, con dos niveles de certeza que se documentaron por separado y NO deben confundirse: Mi Cuenta/Paquetería Nacional/Oficios Judiciales = gestiones REALES (de la matriz de 19 motivos ya conocida) reagrupadas por intuición semántica, sin validar con el negocio; Paquetería Internacional/Mis Comunicaciones Digitales = 4 gestiones cada una INVENTADAS sin ningún dato real detrás, cada label termina literalmente en '(Gestión inventada)' por pedido explícito del usuario. (5) El mecanismo de perfil de usuario (Individuo/Franquicias/Fulfillment, sección 'Usuarios' del panel 'Casos de uso') quedó SUPERSEDED para esta pantalla — se sacó del panel porque ya no tenía ningún efecto (las 7 categorías se muestran siempre completas, sin depender de perfil). El código y los datos (core/session/activeUseCase.ts, core/reclamos/reasonProfiles.ts, core/reclamos/profileVisibility.ts + sus JSON) NO se borraron, quedan documentados como histórico por si se retoman. (6) No se renombró el ítem 'Ingresar Reclamos' del menú de usuario replicado del sitio real (core/navigation/navigation.config.ts) — es fidelidad de chrome de producción, no la pantalla rediseñada. Tampoco se renombraron archivos/carpetas internos (ReclamosListPage.tsx, core/reclamos/) — decisión explícita para minimizar riesgo, documentada en mis-gestiones-categorias.md sección 1. Verificado: typecheck limpio, build de producción limpio, probado en navegador (27 gestiones en 'Todos' = 2+6+4+4+6+4+1, chip 'Paquetería Internacional' muestra las 4 gestiones inventadas con el sufijo correcto, panel 'Casos de uso' ya sin la sección 'Usuarios')."
    - "2026-09-02 (mismo día, corrección sobre el ítem anterior): el usuario aclaró que el mecanismo de perfil de usuario NO quedó reemplazado — sigue existiendo e impacta las agrupaciones (categorías), sólo que ahora son 4 tipos (se agregó 'Pyme') y el eje que controla es la VISIBILIDAD DE CATEGORÍAS (chips), no la de motivos individuales (eso sigue superseded). Regla textual del usuario, sin inferencia: franquicia no ve el grupo/chip 'Fulfillment'; fulfillment no ve 'Franquicia'; individuo y pyme no ven 'Franquicia' ni 'Fulfillment'. Las otras 5 categorías (Mi Cuenta, Paquetería Nacional, Paquetería Internacional, Mis Comunicaciones Digitales, Oficios Judiciales) se ven por igual en los 4 tipos (supuesto, no exclusión textual). Implementado: (1) documentation/data/categorias-gestiones.json subió a schema_version 2, con 'user_types' (4 tipos) y 'profile_category_visibility' (perfil→ids de categoría visibles) como pidió el usuario — una 'base de datos' de 2 niveles (perfil→categorías, categoría→gestiones) pensada para que un dev la edite directamente. (2) core/gestiones/categories.ts expone USER_PROFILES, DEFAULT_USER_PROFILE y visibleCategoriesForProfile(). (3) core/session/activeUseCase.ts repuntado a core/gestiones/categories (antes apuntaba a core/reclamos/reasonProfiles) — mismo patrón de context, ahora con 4 perfiles. (4) HubAccessButton.tsx: se restauró la sección 'Usuarios' del panel 'Casos de uso' (se había sacado horas antes en la misma sesión), ahora con ChipGroup de 4 opciones. (5) ReclamosListPage.tsx: los chips vuelven a depender del perfil activo (useActiveUseCase), con el mismo reseteo automático a 'Todos' de antes si la categoría elegida deja de estar visible al cambiar de perfil. Verificado en navegador: Individuo ve 5 categorías (sin Franquicias/Fulfillment), Franquicias ve 6 (sin Fulfillment), y al cambiar de Franquicias a Fulfillment con el chip 'Franquicias' seleccionado, el filtro resetea solo a 'Todos'. Typecheck y build limpios. Documentado en mis-gestiones-categorias.md secciones 6-9 (renumeradas), pantalla-reclamos-listado.md sección 4 y analisis-funcional-reclamos.md secciones 3-6, con sus equivalentes en el Hub."
    - "2026-09-02 (mismo día, tercer pedido sobre este dataset): el usuario pidió agregar TAGS de búsqueda a cada gestión, generados por Claude (no dato de negocio), máx. 10 por gestión, dio como ejemplo 'Oficios Judiciales → justicia, citación, oficial, cobro, error, falla'. Pidió además un caso especial: si un usuario escribe 'fulfillment' en el buscador debe ver todas las gestiones de esa categoría sin tocar el chip — logrado agregando el tag literal 'fulfillment' a todas las gestiones de esa categoría (y 'franquicia'/'franquicias' a las de Franquicias), sin lógica de código aparte, sólo un tag más matcheado por el buscador. Por pedido explícito, este tag especial de categoría sólo se dio a Fulfillment y Franquicias por ahora. Implementado: (1) documentation/data/categorias-gestiones.json subió a schema_version 3, cada item ahora tiene 'tags' (array de strings, ≤10). (2) core/gestiones/categories.ts: GestionItem ganó el campo tags. (3) ReclamosListPage.tsx: la búsqueda ahora matchea contra label + tags (antes sólo label), mismo normalize() sin acentos de siempre. Verificado en navegador: buscar 'justicia' con 'Todos' seleccionado encuentra 'Inconvenientes con el pago de oficios judiciales' (match por tag, no por label); buscar 'fulfillment' con 'Todos' seleccionado y perfil Individuo activo (que ni siquiera ve el chip Fulfillment) muestra las 6 gestiones de esa categoría. Typecheck y build limpios. Sólo trabajado en local, sin commit ni push (pedido explícito del usuario: 'por ahora solo trabajar el local'). Documentado en mis-gestiones-categorias.md sección 9 (nueva) y su equivalente en el Hub."
    - "2026-09-02 (mismo día, bug encontrado por el usuario probando el prototipo): 'Todos' mostraba las 27 gestiones del sistema completo sin importar el perfil de usuario activo — INCORRECTO. La regla real: un individuo/pyme no debe ver NINGUNA gestión de Franquicias ni Fulfillment, ni siquiera con 'Todos' seleccionado; Franquicias no ve las de Fulfillment (pero sí ve todo lo demás que ve individuo/pyme); Fulfillment no ve las de Franquicias (ídem). Causa: core/gestiones/categories.ts → itemsForFilter() hacía flatMap sobre GESTION_CATEGORIES (las 7 categorías del sistema) en vez de sobre las categorías visibles para el perfil activo. Fix: itemsForFilter() ahora recibe visibleCategories como parámetro obligatorio (ya calculado en ReclamosListPage.tsx vía visibleCategoriesForProfile) y opera sólo sobre esa lista, tanto para 'Todos' como para una categoría puntual. Como consecuencia, la búsqueda por texto/tags también quedó aislada por perfil automáticamente (no hizo falta tocar la búsqueda: opera sobre el resultado ya filtrado). Verificado en navegador: Individuo con 'Todos' ve 17 gestiones (antes 27); Franquicias ve 21; buscar 'franquicia' siendo Individuo da 0 resultados (antes hubiera encontrado las 4 de Franquicias). Typecheck y build limpios. El usuario preguntó además dónde vive el archivo que filtra esto — respondido y documentado explícitamente (sección 0 nueva) en mis-gestiones-categorias.md: hay 2 copias (documentation/data/categorias-gestiones.json y proto navegable/src/core/gestiones/data/categorias-gestiones.json), leídas por core/gestiones/categories.ts. Commiteado y pusheado a GitHub (commit 898c886) junto con el resto de los cambios de la sesión (rename a 'Mis gestiones', categorías, tags, tipos de usuario) — verificado en producción (proto-navegable.vercel.app)."
    - "2026-09-02 (mismo día, pregunta del usuario sobre la duplicación): el usuario notó que los archivos de datos (categorias-gestiones.json, motivos-reclamo-por-perfil.json, visibilidad-perfiles.json) existían 2 veces — una copia en documentation/data/ y otra en proto navegable/src/core/*/data/ — y pidió centralizar la documentación. Se verificó que las 3 parejas de copias eran idénticas byte a byte (sin drift todavía, `diff` sin salida) y se ELIMINARON las 3 copias de documentation/data/ (carpeta ahora vacía), dejando como única fuente la copia dentro de proto navegable/ (la que valida el build/typecheck de la app, a diferencia de una copia sólo-documentación que puede desactualizarse sin que nada avise). Se actualizaron todos los links en motivos-reclamo-por-perfil.md, mis-gestiones-categorias.md (nueva sección 11 'Nota de consolidación'), pantalla-reclamos-listado.md, project.yaml (sources + artifacts.data_path) y el Hub (mis-gestiones-categorias.html), apuntando a la ruta única dentro de proto navegable/. NO se tocaron hub/downloads/*.json: esas copias existen por un motivo distinto y legítimo (el Hub deployado en Vercel con Root Directory='hub' no incluye ni documentation/ ni proto navegable/, necesita su propia copia para servir la descarga) — documentado explícitamente como excepción, no como descuido. Typecheck y build de la app verificados sin cambios (no se tocó ningún archivo que el código importe)."
    - "2026-09-02 (mismo día, ampliación de tags pedida por el usuario): con ejemplos explícitos ('si dice error, agregar falla'; 'si dice demora, agregar problema'), se agregaron tags de sinónimo por patrón de texto en el label, aplicados a las 27 gestiones (no sólo a los 2 ejemplos dados): label con 'error'/'erróneo'/'incorrecto' → tag 'falla'; label con 'demora' → tag 'problema'; extendido por coherencia a 'problema(s)'/'inconveniente(s)' → tag 'problema' donde faltaba. categorias-gestiones.json subió a schema_version 4. Ningún ítem superó el máximo de 10 tags (quedaron entre 5 y 9, verificado con grep). Verificado en navegador: con perfil Individuo activo, buscar 'falla' da 5 gestiones y 'problema' da 6 — ambos coinciden exactamente con la cuenta manual de qué ítems (dentro de las categorías visibles para ese perfil) llevan cada tag. Typecheck y build limpios. Documentado en mis-gestiones-categorias.md sección 9.2 (nueva) y su equivalente en el Hub. Sincronizada la única copia adicional que sigue existiendo por motivo de deploy (hub/downloads/categorias-gestiones.json). Sin commit ni push todavía."
    - "2026-09-02 (mismo día, 2da ampliación de tags): el usuario pidió generalizar a TODAS las categorías el patrón que hasta ahora sólo tenían Fulfillment/Franquicias — que buscar el nombre de una categoría (ej. 'Mi Cuenta') muestre todas sus gestiones. Se agregó a cada gestión el tag de su propia categoría: mi_cuenta→'mi cuenta', paqueteria_nacional→'paqueteria nacional', paqueteria_internacional→'paqueteria internacional', mis_comunicaciones_digitales→'comunicaciones digitales', oficios_judiciales→'oficios judiciales' (franquicias/fulfillment ya lo tenían desde antes). categorias-gestiones.json subió a schema_version 5. Máximo de tags por ítem alcanzado: 10 (justo en el límite, ninguno lo supera). Verificado en navegador: buscar 'Mi Cuenta' (con mayúsculas) da exactamente las 2 gestiones de esa categoría; buscar 'Paquetería Nacional' (con tilde y mayúsculas) da las 6 exactas — confirma que normalize() maneja bien acentos/mayúsculas también para estos tags multi-palabra. Typecheck y build limpios. Documentado en mis-gestiones-categorias.md sección 9.1 (reescrita) y su equivalente en el Hub, sincronizado hub/downloads/categorias-gestiones.json. Sin commit ni push todavía."
    - "2026-09-03: se armó una presentación V1 navegable del proyecto (skill presentacion-proyecto), agregada al Hub como 3ra card ('Presentaciones' → hub/presentaciones.html → hub/presentaciones/presentacion-v1.html), con capturas embebidas del prototipo real vía iframes con deep-link (?profile=/?category=/?q=/?responsive=1/?useCases=1, agregado a core/session/deepLink.ts + providers.tsx/ReclamosListPage.tsx/HubAccessButton.tsx). A pedido del usuario ('el cliente no debe enterarse de que existe un prototipo navegable'), se ocultaron después todas las menciones a 'prototipo navegable'/Hub/rutas de documentación interna, se sacaron los 17 pills 'Volver al hub', y se borró la slide de 'simular tipo de usuario activo' (tooling de prototipo) — el deck ahora narra como si fueran capturas estáticas de Figma. Además se generó un PPTX editable (proto navegable/../hub/presentaciones/presentacion-v1.pptx, via pptxgenjs + Node) con capturas reales tomadas con Puppeteer headless contra proto-navegable.vercel.app (guardadas en hub/presentaciones/screenshots/, con el botón flotante de tooling del prototipo ocultado por CSS antes de cada captura) — 2 rondas de fix pedidas por el usuario: el frame de captura se recalculó para no pasarse del margen derecho del slide, y los chips 'eyebrow' se agrandaron (fórmula de ancho por longitud de texto) para que el texto en mayúsculas/negrita no saltara de línea."
    - "2026-09-03 (bug de búsqueda reportado por el usuario, fix intermedio): buscar 'error justicia' (dos tags de la misma gestión, 'Inconvenientes con el pago de oficios judiciales') daba 'No encontramos gestiones' porque el buscador matcheaba la frase completa como un solo string contra label/tags. Fix: ReclamosListPage.tsx ahora separa la búsqueda en palabras y exige que TODAS matcheen (en cualquier combinación de label+tags de la misma gestión) — no que estén juntas en un mismo campo. Verificado: 'error justicia' → esa gestión aparece porque tiene ambos tags por separado."
    - "2026-09-03 (mismo día, 2 pedidos más sobre datos y buscador): (1) el usuario pidió subir el límite de tags de 10 a 50 y sumar muchos sinónimos coloquiales por gestión (ejemplos dados: 'paquete'→caja/envío/bulto, 'faltante'→robo/vacío/incompleto) — aplicado a las 27 gestiones, cada una subió de 5-10 a 13-25 tags; categorias-gestiones.json subió a schema_version 6. (2) el usuario reportó que el fix anterior (AND de todas las palabras) rompía frases naturales: 'no me acepta pago' daba 0 resultados porque 'no'/'me'/'acepta' no son tags de nada, aunque 'pago' sí matcheaba. Fix definitivo en ReclamosListPage.tsx: se ignoran palabras de 1-2 letras al exigir el match, alcanza con que UNA sola palabra significativa matchee (ya no todas), y los resultados se ordenan por cantidad de palabras coincidentes (más relevante primero) — 'error justicia' sigue funcionando y ahora ordena esa gestión primero en vez de mezclarla con las que sólo matchean 'error'. Verificado en navegador con ambos casos. Documentado en mis-gestiones-categorias.md secciones 9.3/9.4 (+ Hub), corregidas también las menciones desactualizadas en pantalla-reclamos-listado.md y analisis-funcional-reclamos.md que decían 'el buscador filtra sólo por label, no por tags/sinónimos' (quedaron obsoletas desde el 2026-09-02, no se habían corregido hasta ahora). Sincronizados hub/downloads/{categorias-gestiones.json, mis-gestiones-categorias.md, pantalla-reclamos-listado.md, analisis-funcional-reclamos.md} y sus 3 .html del Hub. Se creó .claude/launch.json (servidor dev de proto navegable, puerto 4300) para poder verificar los cambios de búsqueda en el Browser pane antes de documentarlos."
    - "2026-09-03 (unificación de URLs, opción 3 de las 4 analizadas con el usuario): el usuario pidió pasar a monorepo real con UNA sola URL madre y todo lo demás como rutas hijas, para no seguir generando URLs sueltas por cada artefacto. Antes: 2 proyectos Vercel independientes (consultas-correo-v1 con Root Directory='hub' + proto-navegable con Root Directory='proto navegable'), cada uno con su dominio .vercel.app, enlazados a mano — ya había fallado una vez (el Hub apuntó a localhost hasta que se detectó). Ahora: un solo sitio. Implementado: (1) package.json en la RAÍZ del repo (antes no existía) con script 'build' que compila el prototipo y corre scripts/build-hub.mjs, que copia proto navegable/dist a hub/prototipo/; 'postinstall' instala las deps del subproyecto para que un solo `npm install` alcance en local y en CI. (2) vite.config.ts: base='/prototipo/' (sin esto los assets se pedirían a /assets/... y romperían al no estar en la raíz del dominio). (3) App.tsx: BrowserRouter basename={import.meta.env.BASE_URL} — lee el mismo base de Vite, así hay una única fuente de verdad para la ruta del prototipo. (4) vercel.json en la raíz (config-as-code, antes todo vivía sólo en el dashboard): buildCommand/outputDirectory='hub'/installCommand + un rewrite /prototipo/(.*) -> /prototipo/index.html para el routing SPA (hoy hay una sola ruta, pero el router está pensado para sumar pantallas). (5) hub/prototipo/ agregado a .gitignore: es salida de build, se regenera en cada deploy. (6) Links internos que apuntaban a la otra URL: card del Hub -> 'prototipo/' relativo; HubAccessButton HUB_URL de 'https://consultas-correo-v1.vercel.app/' a '/' (funciona igual en local, preview y prod); los 8 iframes del deck de https://proto-navegable.vercel.app/?... a ../prototipo/?... — efecto secundario buscado: el código fuente del deck ya no expone ninguna URL externa del prototipo, refuerza el pedido previo de que el cliente no sepa que existe un prototipo navegable. Verificado en local sirviendo sólo hub/: prototipo carga bajo /prototipo/ con deep-link (?profile=franquicias -> 21 gestiones, chip Franquicias visible), sin errores de consola, iframes del deck resolviendo por ruta relativa, y la card del Hub navegando al prototipo dentro del mismo sitio."
  assumptions:
    - "El alcance v1 se enfoca en mejorar la experiencia de reclamos ya existente, no en sumar tipos de consulta nuevos"
    - "SUPERSEDED (2026-09-01, ver knowledge.confirmed): 'el filtro arranca en el perfil activo' — el usuario corrigió esto en la misma sesión. El comportamiento real es: filtro siempre en 'Todos', el perfil activo controla qué chips existen, no cuál viene elegido."
    - "'Todos' sigue mostrando la unión completa de motivos (19) sin importar el perfil activo — la regla de visibilidad de chips (sección 6 de motivos-reclamo-por-perfil.md) restringe qué CHIPS existen, no qué trae 'Todos'. No confirmado explícitamente que deba ser así para siempre; queda como pregunta abierta."
  open_questions:
    - "¿Las asignaciones 'por intuición' de gestiones a Mi Cuenta, Paquetería Nacional y Oficios Judiciales son correctas? Ver documentation/mis-gestiones-categorias.md sección 4 — necesita validación del negocio."
