artifacts:
  hub:
    status: draft
    path: "hub/index.html"
    structure: "Hub con 3 opciones (Prototipo, Documentación, Presentaciones). 2026-09-22: la tarjeta Prototipo ya no abre una pantalla sino la LANDING del módulo (/prototipo/), donde se elige entre V1 y V2. Documentación abre hub/documentacion.html con 6 cards (brief.html, guia-de-estilos.html, mis-gestiones-categorias.html, motivos-reclamo-por-perfil.html [histórico/superseded], pantalla-reclamos-listado.html, analisis-funcional-reclamos.html); cada doc vuelve con flecha a documentacion.html, y ésta vuelve con flecha a index.html. Presentaciones abre hub/presentaciones.html con 1 card (Presentación V1 → hub/presentaciones/presentacion-v1.html)."
    provider: fallback
    served_via: "servidor estático apuntando directo a la carpeta hub/ (probado con python -m http.server / servidor Node, puerto 4311) — ver .claude/launch.json"
    note: "El Hub es la raíz pública del proyecto (Vercel: Root Directory = 'hub', deployado). Botón 'Descargar' en las 6 cards de documentacion.html y en la esquina superior derecha de cada detalle. Descarga el .md real (y los .json de datos, para los docs de negocio), copiados a hub/downloads/ porque Vercel (Root Directory='hub') no incluye documentation/ en el deploy — sincronizar a mano si el original cambia. 2026-09-02: agregada mis-gestiones-categorias.html (regla de negocio vigente) y marcada motivos-reclamo-por-perfil.html como histórico/superseded en su card y con banner dentro de la página. 2026-09-03: agregado el módulo Presentaciones (deck navegable + PPTX editable descargable con capturas reales embebidas); a pedido del usuario, el deck NO menciona el prototipo navegable ni el Hub (narra como si fueran capturas estáticas), para que un cliente no pida acceso al prototipo en vivo. Sincronizados hub/downloads/{categorias-gestiones.json, mis-gestiones-categorias.md, pantalla-reclamos-listado.md, analisis-funcional-reclamos.md} con los cambios de tags/búsqueda del mismo día. 2026-09-22: tarjeta del Prototipo reescrita ('2 versiones') y los 9 iframes de presentacion-v1.html repuntados de ../prototipo/?... a ../prototipo/v1?... — el deck narra V1, conviene que la URL lo diga. El PPTX (hub/presentaciones/presentacion-v1.pptx) NO se tocó: sigue siendo el de V1 y no menciona V2. PENDIENTE: agregar la 7ma card de documentación (propuesta-v2-reclamo-contextual) a documentacion.html + su .html y su copia en downloads/."
    last_updated: "2026-09-22"
  prototype:
    status: draft
    fidelity: high # chrome/tokens con fidelidad alta; ya tiene 1 pantalla de negocio real ("Mis gestiones")
    path: "proto navegable"
    landing: "/prototipo/" # selector de versiones (src/pages/VersionsLandingPage.tsx), sin chrome de MiCorreo
    children:
      v1:
        label: "V1 — Sección única de gestiones"
        status: review # propuesta ya presentada al cliente
        route: "/prototipo/v1"
        source: "src/pages/ReclamosListPage.tsx + src/core/gestiones/*"
        note: "No se modificó al abrir V2: sólo cambió su ruta (antes era la raíz). Los enlaces viejos a /prototipo/?params redirigen acá solos."
      v2:
        label: "V2 — Asistente guiado (árbol de preguntas)"
        status: draft
        route: "/prototipo/v2"
        source: "src/v2/ (core + data + pages + components + v2.module.css)"
        screens: "AsistentePage (/v2 — buscador + árbol + accesos rápidos + formulario, todo en una ruta con el estado en la query) · EnviosListPage (/v2/envios) · EnvioDetallePage (/v2/envios/:id) · ReclamoConfirmacionPage (/v2/reclamos/:caso)"
        sin_seguimiento: "NO hay pantalla de 'Mis gestiones' ni listado de reclamos. Se construyó una el 2026-09-22 y se quitó el mismo día: nunca se pidió, y el HTML de producción tampoco la tiene (brief sección 2). No reintroducirla sin pedido explícito."
        data: "src/v2/data/{arbol,formularios,envios}.json. arbol.json (schema 2) es el que hay que editar para cambiar preguntas o ramas; no hay lógica de árbol en el código. Sus 19 hojas son las 19 gestiones documentadas de core/gestiones/data/categorias-gestiones.json, verificado por script — NO agregar opciones que no existan ahí. formularios.json y envios.json sí son inventados y lo declaran en su _advertencia."
        dependencias: "lucide-react (instalada el 2026-09-22 con autorización explícita del usuario) para los íconos de las tarjetas. El árbol declara ids semánticos en core/iconos.ts y components/Icono.tsx los resuelve a íconos concretos."
        visibilidad_por_perfil: "Las agrupaciones que ve el usuario salen de profile_category_visibility (core/gestiones/data/categorias-gestiones.json), la MISMA regla que usa V1. V2 la consulta con visibleCategoriesForProfile(); no la copia. El tipo de usuario se simula en el panel 'Casos de uso'. Alcanza a las tarjetas, al buscador y al camino guardado en la URL."
        deep_links: "?p=op1,op2 (camino) · ?q=texto (búsqueda) · ?envio=ID (entrada contextual). Cualquier paso es enlazable y recargable."
        note: "Sin backend: los reclamos creados viven en memoria (src/v2/core/reclamosStore.ts) y se pierden al recargar. Los 2 reclamos iniciales son de ejemplo, para que la pantalla de seguimiento no arranque vacía."
    note: "2026-09-01: primera pantalla real (ReclamosListPage, ruta '/'). 2026-09-02: renombrada de 'Reclamos' a 'Mis gestiones' (constante en core/gestiones/sectionLabel.ts) y migrada a filtro por categorías de producto/servicio (core/gestiones/categories.ts + data/categorias-gestiones.json), con visibilidad de categorías por tipo de usuario (4 tipos: Individuo/Pyme/Franquicias/Fulfillment — core/session/activeUseCase.ts repuntado a core/gestiones en vez de core/reclamos). HubAccessButton: la sección 'Usuarios' del panel 'Casos de uso' se sacó y se restauró el mismo día (el tipo de usuario sí sigue impactando, ahora sobre categorías). core/reclamos/reasonProfiles.ts y profileVisibility.ts (matriz motivo×perfil) siguen sin uso. Typecheck y build de producción verificados sin errores; verificado en navegador: Individuo ve 5 categorías (sin Franquicias/Fulfillment), Franquicias ve 6 (sin Fulfillment), reseteo automático a 'Todos' al cambiar de perfil con una categoría ahora inválida seleccionada. 2026-09-03: soporte de deep-link por query string (core/session/deepLink.ts) para la presentación; tags de búsqueda subidos de 10 a 50 por gestión con sinónimos coloquiales (schema_version 6); algoritmo de búsqueda de ReclamosListPage.tsx reescrito para que una sola palabra de una frase larga alcance (en vez de exigir todas), con resultados ordenados por relevancia. 2026-09-22: la raíz pasó a ser la landing de versiones; V1 se mudó a /v1 sin tocar sus archivos y V2 se agregó completa en src/v2/. Verificado en navegador el recorrido entero de V2 y el redirect de compatibilidad de los enlaces viejos."
    last_updated: "2026-09-22"
  v2-proposal:
    status: draft
    path: "documentation/propuesta-v2-reclamo-contextual.md"
    provider: fallback
    note: "Documenta la propuesta V2: de dónde sale (resumen de reunión de Claims aportado por el usuario el 2026-09-22), el mapeo entidad → problema → punto de entrada → info disponible → formulario → acción posterior, qué es contenido inventado y en qué nivel, y el CONFLICTO DE ALCANCE con el acta del 31/08 (V2 rediseña formularios, que el MVP dejó explícitamente fuera). PENDIENTE: espejo .html en el Hub + copia en hub/downloads/."
