    - "Motivos que antes eran transversales a los 3 perfiles ('Errores en mi factura', 'Errores con el saldo de mi cuenta') ahora sólo figuran en la categoría Franquicias — ¿deberían aparecer también en Fulfillment y/o Mi Cuenta?"
    - "¿'Pyme' tiene alguna diferencia de negocio real con 'Individuo' más allá del nombre, o son equivalentes hoy (mismas categorías visibles, sin gestiones propias documentadas)?"
    - "¿Cómo se determina el tipo de usuario (Individuo/Pyme/Franquicias/Fulfillment) de un usuario logueado en producción? ¿Puede tener más de uno?"
    - "¿Qué tipos de consulta existen más allá de la gestión (seguimiento, listado, edición, historial)?"
